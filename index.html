function closeAudioSettings(){closeModal();if(audioReturnFocus&&audioReturnFocus.isConnected)audioReturnFocus.focus();audioReturnFocus=null}
document.addEventListener('keydown',e=>{const dialog=document.querySelector('.audioSettings');if(!dialog)return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeAudioSettings()}if(e.key==='Tab'){const items=Array.from(dialog.querySelectorAll('button,input'));const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}},true);

async function toggleFullscreen(){try{const root=document.documentElement;if(!document.fullscreenElement){if(root.requestFullscreen)await root.requestFullscreen();else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();else{toast('Fullscreen tidak didukung oleh browser ini.');return}playUiSound('start')}else{if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();playUiSound('click')}}catch(e){toast('Fullscreen tidak didukung oleh browser ini.')}}
function renderFullscreenButton(){const b=document.getElementById('fullscreenToggle');if(!b)return;b.textContent=document.fullscreenElement?'⤢':'⛶';b.title=document.fullscreenElement?'Keluar fullscreen':'Fullscreen';b.setAttribute('aria-label',b.title)}
document.addEventListener('fullscreenchange',renderFullscreenButton);document.addEventListener('webkitfullscreenchange',renderFullscreenButton);
async function enterLabFromCover(mode){
  syncMusic(true);state.onboarding.introSeen=true;saveState();
  try{
    const root=document.documentElement;
    if(mode==='fullscreen'){
      if(!document.fullscreenElement){
        if(root.requestFullscreen)await root.requestFullscreen();
        else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();
        else toast('Fullscreen tidak didukung browser ini. Membuka dalam tampilan biasa.');
      }
    }else{
      if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();
      else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();
    }
  }catch(e){toast('Mode fullscreen tidak dapat diaktifkan. Membuka dalam tampilan biasa.')}
  go('identity');
}

function alveolusSimulation(){return sciencePanel('gas','Pertukaran O₂ dan CO₂ di alveolus','Tekan <b>Play</b> untuk melihat dua gas melintasi membran tipis dalam arah yang berlawanan. Jeda untuk mengamati posisinya.',`<h4>Dua arah difusi</h4><div class="gasNote oxygen"><b>O₂ · alveolus → darah</b><p>Oksigen melewati dinding alveolus dan kapiler, masuk plasma, lalu sebagian besar berikatan dengan hemoglobin (Hb) di dalam eritrosit.</p></div><div class="gasNote carbon"><b>CO₂ · darah → alveolus</b><p>Karbon dioksida melintasi membran ke ruang alveolus. Gas ini kemudian dikeluarkan bersama udara saat ekspirasi.</p></div><div class="scienceKey"><span><i style="background:#176f84"></i> O₂</span><span><i style="background:#aa5409"></i> CO₂</span><span><i style="background:#bb5c78"></i> Eritrosit</span><span><i style="background:#a4e9f5;border:1px solid #176f84"></i> O₂ terikat Hb</span></div><p><b>Mengapa gas berpindah?</b><br>Setiap gas berdifusi dari tekanan parsial lebih tinggi ke lebih rendah. Kedua gas bertukar secara bersamaan.</p><details><summary>Pelajari lebih lanjut</summary><p>Tekanan parsial adalah bagian tekanan yang disumbangkan oleh satu jenis gas. Membran tipis dan permukaan alveoli yang luas membantu difusi.</p><p>Sebagian besar CO₂ diangkut darah sebagai bikarbonat (HCO₃⁻), lalu diubah kembali menjadi CO₂ di paru. Animasi hanya menunjukkan tahap CO₂ melintasi membran.</p><p>Titik O₂ di dalam eritrosit melambangkan O₂ yang terikat Hb; bukan jumlah molekul sebenarnya. Darah tetap mengandung O₂ ketika masuk kapiler paru.</p></details>`)}
function breathingSimulation(){return sciencePanel('breath','Inspirasi dan ekspirasi tenang','Amati paru, tulang rusuk, diafragma, dan panah aliran udara. Satu siklus animasi terdiri atas inspirasi dan ekspirasi.',`<span id="breathPhase" class="sciencePhase">Siap diamati</span><h4 id="breathAction">Mulai satu siklus napas</h4><ol id="breathSteps" class="scienceSteps"></ol><div class="scienceMetrics"><div><span>Volume rongga dada</span><b id="breathVolume">Awal siklus</b></div><div><span>Tekanan alveolus vs udara luar</span><b id="breathPressure">Seimbang</b></div><div><span>Aliran udara</span><b id="breathAir">Belum mengalir</b></div></div><p class="scienceObserve"><b>Coba amati:</b> ketika diafragma turun, apakah paru membesar atau mengecil?</p><details><summary>Catatan ilmiah</summary><p>Pada inspirasi, diafragma dan otot antartulang rusuk berkontraksi. Rongga dada membesar, paru mengikuti geraknya, lalu tekanan alveolus sesaat turun di bawah tekanan udara luar.</p><p>Ekspirasi tenang umumnya pasif: otot relaksasi dan jaringan paru kembali karena elastisitasnya. Tekanan alveolus sesaat meningkat. Pada akhir setiap fase, tekanan kembali seimbang dan aliran berhenti.</p><p>Diagram menyederhanakan anatomi serta peran pleura; gerak paru mengikuti dinding dada melalui hubungan mekanis pleura.</p></details>`,`<div class="sciencePresets"><span>Cuplikan proses:</span><button class="btn secondary" onclick="snapshotScience('breath','in')">Inspirasi</button><button class="btn secondary" onclick="snapshotScience('breath','out')">Ekspirasi</button></div>`)}
function bellJarSimulation(){return sciencePanel('jar','Praktik model bell jar','Tekan <b>Play</b> untuk mengamati karet ditarik ke bawah dan dikembalikan. Gunakan penggeser untuk mencoba posisi karet sendiri.',`<span id="jarPhase" class="sciencePhase">Siap diamati</span><h4 id="jarAction">Karet bawah siap ditarik</h4><ol id="jarSteps" class="scienceSteps"></ol><div class="scienceMetrics"><div><span>Volume ruang dalam botol</span><b id="jarVolume">Awal siklus</b></div><div><span>Tekanan ruang botol</span><b id="jarPressure">Posisi awal</b></div><div><span>Aliran melalui pipa</span><b id="jarAir">Belum mengalir</b></div></div><p class="scienceObserve"><b>Coba jelaskan:</b> mengapa balon membesar saat karet ditarik?</p><details><summary>Bagian model & batasnya</summary><p>Botol mewakili ruang dada, dua balon mewakili paru, pipa bercabang mewakili trakea dan bronkus, serta karet bawah mewakili diafragma.</p><p>Tarikan karet memperbesar ruang di luar balon dan menurunkan tekanannya. Balon mengembang, tekanan udara di dalam balon sesaat turun terhadap udara luar, sehingga udara masuk melalui pipa.</p><p>Saat posisi ditahan, aliran melalui pipa berhenti setelah tekanan di dalam balon seimbang dengan udara luar. Tekanan ruang botol tetap lebih rendah untuk mempertahankan balon mengembang.</p><p>Botol kaku tidak menirukan gerak tulang rusuk. Karet ditarik tangan, sedangkan diafragma asli bergerak karena kontraksi otot. Model tidak menunjukkan alveoli atau pertukaran gas.</p></details>`,`<div class="scienceManual"><label for="jarPull"><b>Tarikan karet bawah</b><span>Geser ke kanan untuk menarik lebih jauh.</span></label><div><input id="jarPull" type="range" min="0" max="100" value="0" oninput="setJarPull(this.value)"><output id="jarPullValue" for="jarPull">0%</output></div><button class="btn secondary" onclick="snapshotScience('jar','in')">Lihat saat ditarik</button><button class="btn secondary" onclick="snapshotScience('jar','out')">Lihat saat kembali</button></div>`)}
function initScienceSims(){for(const k of Object.keys(scienceStates)){if(document.getElementById(k+'Svg')){const speed=document.getElementById(k+'Speed');if(speed)speed.value=String(scienceStates[k].speed);renderScience(k);updateScienceButtons(k)}}}
function stopScienceSims(){for(const k of Object.keys(scienceStates))pauseScience(k)}
function pauseScience(k){const s=scienceStates[k];s.running=false;s.last=null;if(s.frame!==null)cancelAnimationFrame(s.frame);s.frame=null;updateScienceButtons(k)}
function updateScienceButtons(k){const s=scienceStates[k],b=document.getElementById(k+'Play'),status=document.getElementById(k+'Status');if(b){b.textContent=s.running?'Ⅱ Jeda':'▶ Play';b.setAttribute('aria-pressed',String(s.running))}if(status)status.textContent=s.running?'Berjalan':s.time>0||s.manual?'Dijeda':'Siap'}
function toggleScience(k){const s=scienceStates[k];if(s.running){pauseScience(k);return}s.running=true;if(s.manual){const b=s.manual.b;s.time=s.manual.phase==='out'?5+4*Math.acos(2*b-1)/Math.PI:4*Math.acos(1-2*b)/Math.PI;s.manual=null}updateScienceButtons(k);playUiSound('start');s.frame=requestAnimationFrame(ts=>scienceFrame(k,ts))}
function scienceFrame(k,ts){const s=scienceStates[k];if(!s.running)return;if(!document.getElementById(k+'Svg')){pauseScience(k);return}if(s.last!==null)s.time+=Math.min((ts-s.last)/1000,.1)*s.speed;s.last=ts;renderScience(k);s.frame=requestAnimationFrame(next=>scienceFrame(k,next))}
function resetScience(k){pauseScience(k);const s=scienceStates[k];s.time=0;s.manual=null;s.speed=1;const speed=document.getElementById(k+'Speed');if(speed)speed.value='1';renderScience(k);updateScienceButtons(k)}
function snapshotScience(k,phase){pauseScience(k);scienceStates[k].manual={phase,b:.55};renderScience(k);updateScienceButtons(k)}
function setJarPull(v){pauseScience('jar');scienceStates.jar.manual={phase:'held',b:Number(v)/100};renderScience('jar');updateScienceButtons('jar')}
function scienceCycle(k){const s=scienceStates[k];if(s.manual)return s.manual;const t=s.time%10;if(s.time===0)return {b:0,phase:'ready'};if(t<4)return {b:(1-Math.cos(Math.PI*t/4))/2,phase:'in'};if(t<5)return {b:1,phase:'full'};if(t<9)return {b:(1+Math.cos(Math.PI*(t-5)/4))/2,phase:'out'};return {b:0,phase:'empty'}}
function putScience(id,value){const el=document.getElementById(id);if(el)el.textContent=value}
function setScienceAttr(id,attr,value){const el=document.getElementById(id);if(el)el.setAttribute(attr,value)}
function scienceFlow(k,phase,t){const el=document.getElementById(k+'Flow');if(!el)return;const incoming=phase==='in',moving=incoming||phase==='out';if(!moving){el.innerHTML='';return}const color=incoming?'#176f84':'#aa5409';let html='';for(let i=0;i<3;i++){const q=(t*.45+i/3)%1;const y=incoming?22+q*120:142-q*120;html+=`<path d="M372 ${y+(incoming?-8:8)} L380 ${y} L388 ${y+(incoming?-8:8)}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round"/>`}html+=`<text x="407" y="28" fill="${color}" font-size="20" font-weight="700">Udara ${incoming?'masuk ↓':'keluar ↑'}</text>`;el.innerHTML=html}
function renderScience(k){if(!document.getElementById(k+'Svg'))return;if(k==='gas'){renderGas();return}const {b,phase}=scienceCycle(k),incoming=phase==='in',outgoing=phase==='out',moving=incoming||outgoing,held=phase==='held',t=scienceStates[k].time;
scienceFlow(k,phase,t);const title=phase==='ready'?'Siap diamati':incoming?(k==='jar'?'Karet ditarik':'Inspirasi'):outgoing?(k==='jar'?'Karet dikembalikan':'Ekspirasi tenang'):held?'Posisi karet ditahan':'Akhir '+(phase==='full'?'inspirasi':'ekspirasi');putScience(k+'Phase',title);putScience(k+'PhaseLabel',title);
if(k==='breath'){
 const lungs=document.getElementById('breathLungs');Array.from(lungs.children).forEach((lung,i)=>{const x=i?405:354;lung.setAttribute('transform',`translate(${x} 139) scale(${1+.095*b} ${1+.42*b}) translate(${-x} -139)`)});
 setScienceAttr('breathChest','d',`M290 103 Q${190-12*b} 122 ${186-12*b} 235 L${195-12*b} ${358+22*b} Q380 ${420+15*b} ${565+12*b} ${358+22*b} L${574+12*b} 235 Q${570+12*b} 122 470 103`);
 setScienceAttr('breathRibs','transform',`translate(380 103) scale(${1+.065*b} ${1+.025*b}) translate(-380 -103)`);
 setScienceAttr('breathDiaphragm','d',`M${194-12*b} ${355+33*b} Q380 ${262+100*b} ${566+12*b} ${355+33*b}`);
 putScience('breathAction',incoming?'Diafragma berkontraksi & turun':outgoing?'Diafragma relaksasi & naik':phase==='ready'?'Tekan Play atau pilih cuplikan':'Aliran berhenti sesaat');
 putScience('breathVolume',moving?(incoming?'Bertambah ↑':'Berkurang ↓'):b>.5?'Lebih besar':'Lebih kecil');
 putScience('breathPressure',moving?(incoming?'Sesaat lebih rendah ↓':'Sesaat lebih tinggi ↑'):'Seimbang dengan udara luar');
 const steps=incoming?['Diafragma turun dan lebih mendatar.','Tulang rusuk bergerak ke atas dan ke luar.','Rongga dada membesar; paru mengembang.','Tekanan alveolus turun; udara masuk.']:outgoing?['Diafragma naik, kembali melengkung.','Tulang rusuk kembali ke posisi semula.','Paru mengecil karena elastisitasnya.','Tekanan alveolus naik; udara keluar.']:['Amati posisi diafragma dan ukuran paru.','Saat tekanan alveolus seimbang dengan udara luar, aliran berhenti.'];document.getElementById('breathSteps').innerHTML=steps.map(x=>`<li>${x}</li>`).join('');
}else{
 const balloons=document.getElementById('jarBalloons');Array.from(balloons.children).forEach((balloon,i)=>{const x=i?444:316;balloon.setAttribute('transform',`translate(${x} 218) scale(${1+.25*b} ${1+.45*b}) translate(${-x} -218)`)});
 setScienceAttr('jarRubber','d',`M211 357 Q380 ${357+106*b} 549 357`);setScienceAttr('jarGrip','transform',`translate(0 ${53*b})`);
 const range=document.getElementById('jarPull');if(range)range.value=Math.round(b*100);putScience('jarPullValue',Math.round(b*100)+'%');
 putScience('jarAction',incoming?'Tarik karet ke bawah':outgoing?'Kembalikan karet ke atas':held?'Karet ditahan pada posisi pilihan':'Amati balon dan ruang botol');
 putScience('jarVolume',moving?(incoming?'Bertambah ↑':'Berkurang ↓'):b>.01?'Lebih besar':'Posisi awal');
 putScience('jarPressure',moving?(incoming?'Menurun ↓':'Meningkat dari posisi ditarik ↑'):b>.01?'Lebih rendah dari posisi awal':'Kembali ke posisi awal');
 const steps=incoming?['Karet ditarik; ruang botol membesar.','Tekanan ruang di luar balon turun.','Balon mengembang; tekanan di dalamnya sesaat turun.','Udara masuk melalui pipa.']:outgoing?['Karet kembali; ruang botol mengecil.','Tekanan ruang botol meningkat.','Balon mengecil; udara keluar melalui pipa.']:held?['Posisi ini menunjukkan keadaan setelah karet ditahan.','Balon lebih besar ketika karet ditarik lebih jauh.','Setelah seimbang, udara tidak lagi mengalir melalui pipa.']:['Gunakan Play untuk melihat gerakan.','Geser pengatur untuk mencoba tarikan secara manual.'];document.getElementById('jarSteps').innerHTML=steps.map(x=>`<li>${x}</li>`).join('');
}
putScience(k+'Air',moving?(incoming?'Masuk melalui trakea / pipa ↓':'Keluar melalui trakea / pipa ↑'):'Berhenti / seimbang');
const motion=document.getElementById(k+'Motion');if(motion){const y=k==='breath'?416:425;motion.innerHTML=moving?`<path d="M380 ${incoming?y-15:y+10} V${incoming?y+10:y-15}" stroke="${incoming?'#176f84':'#aa5409'}" stroke-width="3" marker-end="url(#${k}${incoming?'Arrow':'Orange'})"/>`:''}
}
function renderGas(){const t=scienceStates.gas.time;let cells='',particles='';for(let i=0;i<5;i++){const q=(t*.055+i/5)%1,x=106+q*515;const loaded=Math.min(4,1+Math.floor(q*4));cells+=`<g transform="translate(${x.toFixed(1)} 353)"><ellipse rx="31" ry="17" fill="#bb5c78" stroke="#8e3e58" stroke-width="2"/><ellipse rx="15" ry="8" fill="#8e3e58" opacity=".4"/><text x="0" y="5" text-anchor="middle" fill="white" font-size="13" font-weight="700">Hb</text>`;for(let j=0;j<loaded;j++){const dx=[-19,19,-19,19][j],dy=[-9,-9,9,9][j];cells+=`<circle cx="${dx}" cy="${dy}" r="4" fill="#a4e9f5" stroke="#176f84" stroke-width="1.5"/>`}cells+='</g>'}
for(let i=0;i<4;i++){const q=(t*.22+i/4)%1;particles+=`<circle cx="${294+(i%2)*10}" cy="${185+q*143}" r="6" fill="#176f84"/><circle cx="${476-(i%2)*10}" cy="${319-q*137}" r="6" fill="#aa5409"/>`}
document.getElementById('gasCells').innerHTML=cells;document.getElementById('gasParticles').innerHTML=particles}
function initAlveolusSim(){initScienceSims()}
function pauseAlveolusSim(){stopScienceSims()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopScienceSims()});

function zoomScience(k){const el=document.getElementById(k+'Svg');if(!el)return;pauseScience(k);const source='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(el));openImageZoom(source,el.querySelector('title').textContent)}

function header(){return `<header class="header"><button class="headBtn" aria-label="Menu Utama" onclick="go('dashboard')"><img src="${a('ikon_home.webp')}" alt=""></button><div class="brand">RESPIRALAB</div><div class="progressMini" style="display:grid;grid-template-columns:25px 1fr;gap:7px;align-items:center"><img src="${a('ikon_progress.webp')}" alt="" style="width:25px"><div><div class="small"><b id="labProgText">0/6 Lab</b></div><div class="bar"><span id="labProgBar" style="width:0%"></span></div></div></div><button class="headBtn" aria-label="Petunjuk" onclick="go('guide',true)"><img src="${a('ikon_petunjuk.webp')}" alt=""></button><button id="audioToggle" class="headTextBtn" onclick="openAudioSettings()" aria-label="Pengaturan suara musik dan SFX" title="Pengaturan suara musik dan SFX">🔊</button><button id="fullscreenToggle" class="headTextBtn" onclick="toggleFullscreen()" aria-label="Fullscreen" title="Fullscreen">⛶</button><div id="saveChip" class="saveChip"></div></header>`}
function renderStorageChip(){const el=document.getElementById('saveChip');if(!el)return;el.innerHTML=storageAvailable?`<img src="${a('status_storage_saved.webp')}" alt=""><span>Tersimpan lokal</span>`:`<img src="${a('status_storage_failed.webp')}" alt=""><span>Mode sesi</span>`;const done=Object.values(state.labs).filter(x=>x.checkpointPassed).length;const t=document.getElementById('labProgText'),b=document.getElementById('labProgBar');if(t)t.textContent=done+'/6 Cek';if(b)b.style.width=(done/6*100)+'%'}
function wrap(content,footer=true){return `<div class="screen" style="background-image:linear-gradient(rgba(251,250,255,.93),rgba(251,250,255,.96)),url('${a('bg_lab_respiralab.webp')}');background-size:cover;background-attachment:fixed">${header()}<main class="content">${content}${footer?credits():''}</main></div>`}
function credits(){return `<div class="credits">RespiraLab • MPI IPA Kelas VIII • Kurikulum Merdeka • Simulasi ilmiah internal SVG • Penyimpanan hasil: browser/localStorage. Visual eksternal: BBGTK Jateng, Wikimedia Commons, Kementerian Kesehatan RI sesuai atribusi pada materi.</div>`}
function go(route,arg){stopMissionClock();stopScienceSims();closeImageZoom();state.navigation.lastRoute=route;saveState();window.scrollTo(0,0);const app=document.getElementById('app');const fn=routes[route]||routes.dashboard;app.innerHTML=fn(arg);renderStorageChip();afterRender(route,arg)}
function afterRender(route,arg){if(route==='evaluation')renderEvalQuestion(currentEvalIndex);if(route.startsWith('lab'))markLabVisited(Number(route.slice(3)));if(route==='reflection')fillReflection();if(route==='aperception')initAperceptionCinema();initAlveolusSim();initMissionView();syncMusic();renderAudioButton();renderFullscreenButton();;setTimeout(initMaterialImageZoom,0)}
function markLabVisited(i){const l=state.labs['lab'+i];l.visited=true;if(l.status==='open')l.status='studying';saveState();}
function statusInfo(i){const l=state.labs['lab'+i];if(l.checkpointPassed)return ['Selesai','status_selesai.webp'];if(l.reviewRequired.length)return ['Perlu Ulang','status_perlu_ulang.webp'];if(l.viewedSections.length>=2)return ['Materi Dipelajari','status_materi_dipelajari.webp'];if(l.visited)return ['Sedang Dipelajari','status_sedang_dipelajari.webp'];return ['Terbuka','status_aktif.webp']}
function footerNav(prev,next){return `<div class="footerNav">${prev?`<button class="btn secondary" onclick="go('${prev}')"><img src="${a('ikon_kembali.webp')}" alt=""> Kembali</button>`:'<span></span>'}<button class="btn secondary" onclick="go('dashboard')">Menu Utama</button>${next?`<button class="btn" onclick="go('${next}')">Lanjut <img src="${a('ikon_lanjut.webp')}" alt=""></button>`:'<span></span>'}</div>`}
function intro(){return `<section class="hero" style="background-image:url('${a('bg_pembuka_respiralab.webp')}')"><button id="audioToggle" class="headTextBtn coverSound" onclick="openAudioSettings()" aria-label="Pengaturan suara musik dan SFX" title="Pengaturan suara musik dan SFX">🔊</button><div class="heroOverlay"><div class="heroInner"><div><span class="eyebrow">IPA • Kelas VIII • 3 JP</span><h1>RESPIRA<span style="color:var(--o)">LAB</span></h1><h2>Laboratorium Digital Sistem Pernapasan Manusia</h2><p class="muted">Amati organ, uji mekanisme, baca data, lalu pecahkan masalah kesehatan pernapasan bersama Oxy-bot, Reska, dan Vero.</p><div class="coverModeChoice"><div class="coverModeTitle">Pilih mode tampilan sebelum masuk</div><div class="coverModeBtns"><button class="btn orange coverModeBtn" onclick="enterLabFromCover('fullscreen')"><span class="coverModeIcon">⛶</span> Masuk Fullscreen</button><button class="btn coverModeBtn normal" onclick="enterLabFromCover('normal')"><span class="coverModeIcon">▣</span> Masuk Tanpa Fullscreen</button></div><div class="coverModeNote">Fullscreen disarankan untuk pengalaman cinematic. Kamu tetap dapat mengubah mode lewat tombol ⛶ di dalam aplikasi.</div></div><p class="small muted">Data belajar disimpan pada browser perangkat ini dan tidak dikirim ke server.</p></div><img class="heroMascot" src="${a('char_oxybot_netral.webp')}" alt="Oxy-bot, maskot robot RespiraLab"></div></div></section>`}

function guide(returnOnly=false){const cards=[['Terbuka','status_aktif.webp','Dapat dipilih kapan saja. Mode akses RespiraLab adalah Bebas.'],['Sedang Dipelajari','status_sedang_dipelajari.webp','Materi pernah dibuka dan masih dieksplorasi.'],['Materi Dipelajari','status_materi_dipelajari.webp','Materi sudah dibaca; cek pemahaman belum tuntas.'],['Perlu Ulang','status_perlu_ulang.webp','Checkpoint perlu dicoba lagi setelah membuka ulang bagian terkait.'],['Selesai','status_selesai.webp','Checkpoint Lab berhasil.']];return wrap(`<span class="eyebrow">Petunjuk & Alur Penggunaan</span><h2>Cara menggunakan RespiraLab</h2><div class="grid grid2"><div class="card"><img src="${a('ill_alur_respiralab.webp')}" alt="Ilustrasi alur penggunaan RespiraLab" style="width:100%;border-radius:16px"><p><b>Menu Utama adalah pusat navigasi.</b> Semua Lab, Misi RespiraLab, Data Challenge, Refleksi, dan Evaluasi dapat dibuka sejak awal. Progress hanya penanda, bukan pengunci.</p></div><div class="card"><h3>Tombol penting</h3><p><b>Home/Menu Utama</b> kembali ke dashboard. <b>Lanjut</b> mengikuti urutan belajar yang disarankan. <b>Kembali</b> ke layar sebelumnya. <b>Petunjuk</b> membuka halaman ini kapan saja.</p><p><b>🔊 Pengaturan suara</b> mengatur musik latar dan efek suara (SFX) secara terpisah, termasuk volume masing-masing. <b>⛶ Fullscreen</b> memperbesar MPI memenuhi layar; tekan lagi atau gunakan tombol keluar fullscreen pada browser untuk kembali.</p><p>Jika Cek Pemahaman salah, baca ulang bagian yang disarankan lalu coba kembali. Cek Pemahaman dan skor Game <b>tidak memengaruhi Nilai Evaluasi Akhir</b>.</p></div></div><h3>Status belajar</h3><div class="grid grid3">${cards.map(x=>`<div class="card guideStatus"><img src="${a(x[1])}" alt=""><div><b>${x[0]}</b><div class="small muted">${x[2]}</div></div></div>`).join('')}</div><div class="callout"><b>Syarat Lihat Hasil:</b> kartu Lihat Hasil baru aktif setelah Evaluasi Akhir dikirim. Evaluasi sendiri tetap aktif sejak awal karena mode akses Bebas.</div><button class="btn orange" onclick="state.onboarding.guideSeen=true;saveState();${returnOnly?'go(\'dashboard\')':'go(\'aperception\')'}">${returnOnly?'Kembali ke Menu Utama':'Mulai Belajar'}</button>${footerNav('',returnOnly?'dashboard':'aperception')}`)}
let aperScene=0;
const APER_SCENES=[
{speaker:'OXY-BOT',role:'Pemandu RespiraLab',phase:0,type:'Percakapan',over:'SATU FENOMENA, BANYAK PETUNJUK',title:'Mengapa napas berubah setelah bergerak?',text:'Selamat datang di RespiraLab. Vero baru selesai aktivitas singkat dan napasnya menjadi lebih cepat. Kita tidak akan menebak—kita akan memakai data, hubungan sebab-akibat, dan bukti.',center:`<div class="aperDataRow"><div class="aperDatum"><strong>16×</strong><span>duduk tenang</span></div><span class="aperArrow">→</span><div class="aperDatum"><strong>30×</strong><span>setelah aktivitas</span></div><span class="aperArrow">→</span><div class="aperDatum"><strong>19×</strong><span>pemulihan</span></div></div>`},
{speaker:'VERO',role:'Peneliti muda',phase:0,type:'Fenomena',over:'AMATI DATA',title:'“Paruku kelelahan?”',text:'Tadi frekuensi napasku sekitar 16 kali per menit. Setelah aktivitas singkat naik menjadi sekitar 30. Apakah napas cepat selalu berarti ada gangguan?',center:`<div class="aperDataRow"><div class="aperDatum"><strong>16</strong><span>kali/menit</span></div><span class="aperArrow">→</span><div class="aperDatum"><strong>30</strong><span>kali/menit</span></div></div><p class="small muted">Contoh pembelajaran, bukan data diagnosis.</p>`},
{speaker:'RESKA',role:'Peneliti muda',phase:1,type:'Hubungkan',over:'HUBUNGKAN DENGAN KEBUTUHAN SEL',title:'Sel bekerja lebih aktif',text:'Saat aktivitas, sel otot menggunakan lebih banyak energi. Itu berarti kebutuhan O₂ meningkat dan CO₂ hasil metabolisme perlu dibuang lebih cepat. Jadi perubahan napas bisa menjadi respons normal tubuh.',center:`<div class="scienceEquation">aktivitas ↑ → kebutuhan O₂ ↑ + produksi CO₂ ↑</div>`},
{speaker:'OXY-BOT',role:'Pemandu RespiraLab',phase:1,type:'Petunjuk',over:'JANGAN LUPA: PARU + DARAH',title:'Pertukaran gas tidak berhenti di paru',text:'O₂ harus menyeberang dari alveolus ke kapiler, lalu dibawa darah. Sebagian besar O₂ diangkut dengan berikatan secara reversibel pada hemoglobin di dalam sel darah merah.',center:`<img src="${a('ill_hemoglobin_o2.svg')}" alt="Oksigen berikatan dengan hemoglobin di sel darah merah" style="width:100%;max-height:190px;object-fit:contain">`},
{speaker:'VERO',role:'Peneliti muda',phase:2,type:'Selidiki',over:'PERTANYAAN BARU',title:'Di bagian mana O₂ dan CO₂ bertukar?',text:'Kalau udara melewati banyak organ—hidung, trakea, bronkus, bronkiolus—mengapa pertukaran gas utama justru terjadi di alveolus?',center:`<div class="aperDataRow"><div class="aperDatum"><strong>tipis</strong><span>jarak difusi</span></div><div class="aperDatum"><strong>luas</strong><span>permukaan</span></div><div class="aperDatum"><strong>kapiler</strong><span>sangat dekat</span></div></div>`},
{speaker:'RESKA',role:'Peneliti muda',phase:2,type:'Dugaan',over:'STRUKTUR ↔ FUNGSI',title:'Alveolus cocok untuk difusi',text:'Dinding alveolus dan kapiler sangat tipis, permukaannya luas, dan jaraknya sangat dekat. Itu memperpendek lintasan difusi sehingga pertukaran gas dapat berlangsung efisien.',center:`<img src="${a('ill_alveolus_kapiler.webp')}" alt="Alveolus dikelilingi kapiler" style="width:100%;max-height:190px;object-fit:contain">`},
{speaker:'OXY-BOT',role:'Pemandu RespiraLab',phase:2,type:'Misteri',over:'MISI RESPIRALAB',title:'Buktikan, bukan sekadar hafal',text:'Di Lab 1–6 kamu akan menghubungkan jalur udara, alveolus, mekanisme ventilasi, data frekuensi dan volume, serta faktor kesehatan. Di Lab 2, amati juga O₂ yang masuk ke darah dan menempel pada hemoglobin.',center:`<div class="pillRow" style="justify-content:center"><span class="pill">jalur udara</span><span class="pill">alveolus</span><span class="pill">ventilasi</span><span class="pill">data napas</span><span class="pill">kesehatan</span></div>`},
{speaker:'OXY-BOT',role:'Pemandu RespiraLab',phase:2,type:'Hipotesis Awal',over:'SEBELUM MASUK LAB',title:'Apa dugaan awalmu?',text:'Pilih dugaan yang paling dekat dengan pikiranmu sekarang. Tidak harus langsung benar—jawaban ini akan kamu bandingkan lagi saat refleksi.',form:true,center:`<p class="small muted">Hipotesis awal disimpan lokal pada perangkat ini.</p>`}
];
function aperception(){return `<section class="aperCinema" style="background-image:url('${a('bg_pembuka_respiralab.webp')}')"><div class="aperHud"><div class="aperHudLeft"><div class="aperBrandChip">APERSEPSI <b>•</b> MISTERI NAPAS</div></div><div class="aperHudRight"><button id="audioToggle" class="aperHudBtn" onclick="openAudioSettings()" aria-label="Pengaturan suara musik dan SFX">🔊</button><div class="aperProgress" id="aperProgress">01 / ${String(APER_SCENES.length).padStart(2,'0')}</div><button class="aperHudBtn" onclick="toggleFullscreen()" aria-label="Fullscreen">⛶</button><button class="aperHudBtn" onclick="go('guide',true)">❓ Panduan</button></div></div><div class="aperSteps" id="aperSteps"></div><div class="aperStage"><img id="aperOxy" class="aperChar" src="${a('char_oxybot_menjelaskan.webp')}" alt="Oxy-bot"><div class="aperCenterCard"><div class="overline" id="aperOver"></div><h2 id="aperTitle"></h2><div id="aperCenter" class="aperCenterVisual"></div></div><div class="aperStudents"><img id="aperVero" class="aperChar" src="${a('char_vero_netral.webp')}" alt="Vero"><img id="aperReska" class="aperChar" src="${a('char_reska_data.webp')}" alt="Reska"></div></div><div class="aperDialogue"><div class="aperSpeakerRow"><span class="aperSpeaker" id="aperSpeaker">OXY-BOT</span><span class="aperRole" id="aperRole"></span><span class="aperType" id="aperType"></span></div><div class="aperText" id="aperTextLine"></div><div id="aperFormHost"></div><div class="aperDialogueNav"><button class="aperNavBtn" id="aperPrev" onclick="aperPrev()">⬅ Kembali</button><div class="aperKeyHint">Enter / Spasi untuk lanjut • ← → pindah adegan</div><button class="aperNavBtn next" id="aperNext" onclick="aperNext()">Lanjut ➜</button></div></div></section>`}
function initAperceptionCinema(){aperScene=0;renderAperScene()}
function renderAperScene(){const scene=APER_SCENES[aperScene];if(!scene)return;const q=id=>document.getElementById(id);q('aperProgress').textContent=String(aperScene+1).padStart(2,'0')+' / '+String(APER_SCENES.length).padStart(2,'0');q('aperSteps').innerHTML=['FENOMENA','HUBUNGKAN','SELIDIKI'].map((x,i)=>`<span class="aperStep ${i===scene.phase?'active':''}"><i>${i+1}</i>${x}</span>`).join('');q('aperOver').textContent=scene.over;q('aperTitle').textContent=scene.title;q('aperCenter').innerHTML=scene.center||'';q('aperSpeaker').textContent=scene.speaker;q('aperRole').textContent=scene.role;q('aperType').textContent=scene.type;q('aperTextLine').textContent=scene.text;const form=q('aperFormHost');form.innerHTML=scene.form?`<div class="aperForm"><div><label for="aperChoice">Pilih dugaan</label><select id="aperChoice"><option value="">Pilih…</option><option ${state.aperception.choice==='energy'?'selected':''} value="energy">Tubuh membutuhkan pertukaran gas lebih cepat saat aktivitas.</option><option ${state.aperception.choice==='sick'?'selected':''} value="sick">Napas cepat selalu berarti sakit.</option><option ${state.aperception.choice==='lungs'?'selected':''} value="lungs">Paru-paru bekerja sendiri tanpa bantuan otot tubuh.</option></select></div><div><label for="aperText">Jelaskan alasanmu (maks. 180 karakter)</label><textarea id="aperText" maxlength="180" placeholder="Contoh: Menurut saya…">${esc(state.aperception.initialHypothesis)}</textarea></div></div>`:'';q('aperPrev').disabled=aperScene===0;q('aperNext').textContent=scene.form?'Simpan & Masuk Lab ➜':'Lanjut ➜';const dialog=q('aperDialogue');if(dialog){dialog.classList.toggle('formScene',!!scene.form);dialog.classList.toggle('compactScene',!scene.form)}const active=scene.speaker;[['aperOxy','OXY-BOT'],['aperVero','VERO'],['aperReska','RESKA']].forEach(([id,name])=>{const el=q(id);if(!el)return;el.classList.toggle('active',active===name);el.classList.toggle('dim',active!==name)});}
function aperNext(){if(aperScene<APER_SCENES.length-1){aperScene++;playUiSound('select');renderAperScene();return}saveAperception()}
function aperPrev(){if(aperScene>0){aperScene--;playUiSound('click');renderAperScene()}else go('guide')}
function saveAperception(){const choice=document.getElementById('aperChoice')?.value||'';const text=document.getElementById('aperText')?.value.trim()||'';if(!choice){toast('Pilih satu dugaan awal sebelum masuk Menu Utama.');return}state.aperception.choice=choice;state.aperception.initialHypothesis=text;state.onboarding.aperceptionCompleted=true;saveState(true);go('dashboard')}
document.addEventListener('keydown',e=>{if(state.navigation.lastRoute!=='aperception'||document.querySelector('.audioSettings'))return;const tag=(e.target&&e.target.tagName||'').toLowerCase();if(tag==='textarea'||tag==='select'||tag==='input')return;if(e.key==='ArrowLeft'){e.preventDefault();aperPrev()}if(e.key==='ArrowRight'||e.key==='Enter'||e.code==='Space'){e.preventDefault();aperNext()}});

function dashboard(){const done=Object.values(state.labs).filter(l=>l.checkpointPassed).length;const evalDone=state.evaluation.submitted;const cards=[['Tujuan Pembelajaran','ikon_tujuan.webp','objectives','6 tujuan terukur dan kriteria ketercapaian','Aktif'],['Materi Pembelajaran','ikon_materi.webp','hub','Hub Lab 1–6; semua Lab bebas dipilih','Aktif'],['Mini Game: Misi RespiraLab','ikon_game.webp','game','9 misi interaktif, dialog cinematic, dan 3 lencana','Aktif'],['Evaluasi','ikon_evaluasi.webp','evaluation','20 soal multi-tipe; aktif sejak awal','Aktif'],['Lihat Hasil','ikon_hasil.webp',evalDone?'result':'lockedResult',evalDone?'Nilai, kategori, penguatan, dan review soal':'Selesaikan Evaluasi terlebih dahulu',evalDone?'Aktif':'Belum tersedia'],['Refleksi','ikon_refleksi.webp','reflection','Catatan ilmuwan: paham, sulit, dan rencana perbaikan','Aktif']];return wrap(`<div class="dashboardHero card"><div><span class="eyebrow">Halo, ${esc(state.student.name||'Peneliti Muda')}!</span><h2>Menu Utama RespiraLab</h2><p class="muted">Mode akses <b>Bebas</b>. Kamu boleh memilih materi dalam urutan apa pun. Urutan Lab 1–6 tetap direkomendasikan agar konsep berkembang dari struktur hingga kesehatan.</p><div class="pillRow"><span class="pill">${done}/6 checkpoint berhasil</span><span class="pill">${evalDone?'Evaluasi sudah dikirim':'Evaluasi siap dibuka'}</span><span class="pill">Kelas ${esc(state.student.className||'-')}</span></div><div class="dashboardExitRow"><button class="btn dashboardExitBtn" onclick="confirmExitToCover()">↩ Keluar</button><span class="small muted">Kembali ke cover dan mulai dengan identitas baru.</span></div></div><img src="${a('char_oxybot_menjelaskan.webp')}" alt="Oxy-bot menjelaskan"></div><div class="grid grid3">${cards.map(c=>`<div class="card menuCard ${c[2]==='lockedResult'?'lockedOverlay':''}" onclick="${c[2]==='lockedResult'?`toast('Selesaikan dan kirim Evaluasi Akhir terlebih dahulu.')`:`go('${c[2]}')`}"><img class="menuIcon" src="${a(c[1])}" alt=""><h3>${c[0]}</h3><p class="muted">${c[3]}</p><span class="statusBadge">${c[4]}</span></div>`).join('')}</div>`) }
const DEEP_DIVE={
1:{title:'Pendalaman Lab 1 — Struktur Saluran Pernapasan',cards:[['Pembersihan mukosilier','Epitel saluran napas memiliki mukus yang menangkap partikel. Gerak silia membantu mendorong mukus ke arah faring. Mekanisme ini merupakan salah satu pertahanan nonspesifik saluran napas.'],['Mengapa ada tulang rawan?','Cincin tulang rawan pada trakea membantu mencegah saluran kolaps saat tekanan berubah. Bronkiolus lebih kecil dan memiliki lebih banyak otot polos, bukan cincin tulang rawan besar.'],['Zona konduksi vs respirasi','Sebagian saluran berfungsi terutama mengantar dan mengondisikan udara. Pertukaran gas efektif terjadi di zona respirasi, terutama alveoli.']]},
2:{title:'Pendalaman Lab 2 — Fisiologi Pertukaran Gas',asset:'ill_hemoglobin_o2.svg',cards:[['Gradien tekanan parsial','Gas berdifusi dari tekanan parsial lebih tinggi ke lebih rendah. Di paru normal, gradien PO₂ mendorong O₂ ke darah dan gradien PCO₂ mendorong CO₂ ke alveolus.'],['Hemoglobin memperbesar kapasitas angkut O₂','O₂ larut hanya sedikit dalam plasma. Sebagian besar O₂ berikatan reversibel dengan atom besi pada gugus heme hemoglobin di dalam eritrosit, membentuk oksihemoglobin.'],['CO₂ bukan hanya gas bebas','Sebagian besar CO₂ dari jaringan diangkut sebagai ion bikarbonat (HCO₃⁻). Di paru, reaksi dibalik sehingga CO₂ dapat berdifusi ke alveolus dan dikeluarkan.'],['Prinsip Fick secara kualitatif','Laju difusi meningkat bila luas permukaan atau gradien meningkat, dan menurun bila jarak/ketebalan membran meningkat. Ini menjelaskan mengapa alveoli banyak, tipis, dan dekat kapiler.']]},
3:{title:'Pendalaman Lab 3 — Tekanan, Volume, dan Ventilasi',cards:[['Hukum Boyle secara kualitatif','Pada suhu relatif tetap, peningkatan volume rongga dada cenderung menurunkan tekanan di dalam paru sehingga udara masuk; penurunan volume meningkatkan tekanan sehingga udara keluar.'],['Peran pleura','Paru mengikuti gerak dinding dada melalui hubungan mekanis dengan rongga pleura. Tekanan intrapleura normal membantu mempertahankan paru tetap mengembang.'],['Ekspirasi paksa','Ekspirasi tenang banyak terjadi secara pasif akibat recoil elastik. Pada ekspirasi paksa, otot perut dan otot antartulang rusuk internal dapat membantu.']]},
4:{title:'Pendalaman Lab 4 — Volume Paru dan Pengukuran',cards:[['Volume tidal dan cadangan','Volume tidal adalah udara tiap napas biasa. Ada volume cadangan inspirasi dan ekspirasi yang dapat digunakan ketika kebutuhan ventilasi meningkat.'],['Kapasitas vital','Kapasitas vital merupakan jumlah udara maksimum yang dapat dikeluarkan setelah inspirasi maksimal. Nilainya dipengaruhi ukuran tubuh, usia, kebugaran, dan kondisi pernapasan.'],['Batas spirometri sederhana','Volume residu tetap berada di paru setelah ekspirasi maksimal, sehingga tidak dapat diukur langsung dengan spirometri sederhana.']]},
5:{title:'Pendalaman Lab 5 — Mengapa Frekuensi Napas Berubah?',cards:[['CO₂ dan pH sebagai sinyal penting','Pada orang sehat, perubahan CO₂ dan pH merupakan pengendali penting ventilasi. Kenaikan CO₂ dapat meningkatkan dorongan bernapas melalui kemoreseptor.'],['Aktivitas fisik','Saat aktivitas, produksi CO₂ dan kebutuhan O₂ meningkat. Sistem saraf, otot, jantung, dan paru berkoordinasi sehingga ventilasi dapat meningkat cepat.'],['Variasi normal','Frekuensi napas dipengaruhi usia, aktivitas, posisi tubuh, suhu, emosi, lingkungan, dan kondisi individu. Satu angka tidak boleh dipakai sendirian untuk diagnosis.']]},
6:{title:'Pendalaman Lab 6 — Gangguan, Risiko, dan Perlindungan',cards:[['Risiko tidak sama dengan kepastian','Paparan asap rokok, polusi, dan iritan dapat meningkatkan risiko gangguan pernapasan, tetapi data kelompok tidak otomatis membuktikan penyebab tunggal pada setiap individu.'],['Asma dan penyempitan saluran','Pada asma terjadi inflamasi dan hiperrespons saluran napas yang dapat menyebabkan bronkokonstriksi dan peningkatan mukus. Penanganannya memerlukan penilaian medis.'],['Merokok dan pertahanan saluran napas','Asap rokok dapat merusak fungsi silia dan memperberat inflamasi. Menghindari paparan asap adalah tindakan pencegahan berbasis bukti yang penting.']]}
};

const LABS={
1:{title:'Lab 1 — Peta Sistem Pernapasan',q:'Jalur apa yang dilewati udara dan mengapa setiap bagiannya berbeda?',sections:[
{id:'jalur',title:'A. Ikuti Perjalanan Udara',html:`<p>Udara dari lingkungan umumnya melewati <b>rongga hidung → faring → laring → trakea → bronkus → bronkiolus → alveolus</b>. Setiap bagian mempunyai struktur yang mendukung fungsinya.</p><div class="stepFlow">${['Rongga hidung','Faring','Laring','Trakea','Bronkus','Bronkiolus','Alveolus'].map((x,i)=>`<span class="step">${x}</span>${i<6?'<span class="arrow">→</span>':''}`).join('')}</div><p><b>Diafragma bukan saluran udara.</b> Diafragma adalah otot utama yang membantu ventilasi dengan mengubah volume rongga dada.</p>`,visual:'external-bbgtk'},
{id:'fungsi',title:'B. Organ dan Fungsinya',html:`<div class="grid grid2"><div><h4>Rongga hidung</h4><p>Membantu menyaring, menghangatkan, dan melembapkan udara.</p><h4>Faring & laring</h4><p>Faring menjadi persimpangan jalur udara dan makanan; laring merupakan bagian saluran udara yang juga berkaitan dengan produksi suara.</p></div><div><h4>Trakea, bronkus, bronkiolus</h4><p>Trakea ditopang cincin tulang rawan dan bercabang menjadi bronkus; cabang menjadi lebih kecil sampai bronkiolus.</p><h4>Alveolus</h4><p>Ujung jalur yang menjadi lokasi utama pertukaran gas dengan kapiler.</p></div></div><div class="callout"><b>Contoh kontekstual:</b> debu di jalan dapat mengiritasi saluran napas; makanan yang “salah jalan” dapat memicu refleks batuk.</div>`},
{id:'struktur',title:'C. Struktur Mendukung Fungsi',html:`<div class="pillRow"><span class="pill">Trakea: cincin tulang rawan → membantu saluran tetap terbuka</span><span class="pill">Cabang bronkus → distribusi udara</span><span class="pill">Alveolus tipis → pertukaran gas</span></div><div class="callout"><b>Miskonsepsi:</b> paru bukan dua “balon kosong”. Paru berisi jaringan saluran bercabang, pembuluh darah, dan banyak alveoli.</div>`}

2:{title:'Lab 2 — Misteri Pertukaran Gas',q:'Mengapa pertukaran gas terjadi terutama di alveolus?',sections:[
{id:'alveolus',title:'A. Zoom ke Alveolus',html:`<p>Alveoli memiliki <b>dinding sangat tipis</b>, permukaan lembap, jumlah sangat banyak sehingga luas permukaan besar, serta dikelilingi jaringan kapiler. Kombinasi struktur ini membantu pertukaran gas berlangsung efisien.</p>`,visual:'ill_alveolus_kapiler.webp'},
{id:'gas',title:'B. Arah Pergerakan Gas',html:`<p>Difusi gas berlangsung mengikuti <b>gradien tekanan parsial</b>: O₂ bergerak dari alveolus menuju darah kapiler, sedangkan CO₂ bergerak dari darah menuju alveolus.</p><div class="stepFlow"><span class="step">O₂ alveolus</span><span class="arrow">→</span><span class="step">plasma</span><span class="arrow">→</span><span class="step">hemoglobin eritrosit</span><span class="step">CO₂ darah</span><span class="arrow">→</span><span class="step">alveolus</span></div><p>Setelah masuk darah, sebagian besar O₂ diangkut terikat hemoglobin. CO₂ dari jaringan banyak diangkut sebagai bikarbonat dan dilepas kembali sebagai CO₂ di paru.</p>`,visual:'ill_difusi_o2_co2.webp'},{id:'simdifusi',title:'C. Simulasi Difusi di Alveolus',html:`<p>Gunakan simulasi ini untuk mengamati arah gerak O₂ dan CO₂ pada alveolus. Perhatikan gas melintasi membran yang sama dalam arah berlawanan, sementara eritrosit tetap berada di dalam kapiler.</p>${alveolusSimulation()}`},
{id:'akibat',title:'D. Struktur ↔ Fungsi',html:`<p>Efisiensi pertukaran gas dipengaruhi oleh <b>luas permukaan, ketebalan membran, besar gradien tekanan parsial, dan kecocokan ventilasi–perfusi</b>. Jika salah satunya terganggu, pertukaran gas dapat menurun.</p><div class="callout"><b>Miskonsepsi:</b> bronkus terutama menyalurkan udara; pertukaran gas utama berlangsung pada alveoli. O₂ juga tidak sekadar 'mengambang' di darah—sebagian besar berikatan dengan hemoglobin.</div>`}
],checkpoint:[

{id:'model',title:'C. Model Bell Jar & Prediksi',html:`<p>Model botol membantu menunjukkan hubungan perubahan volume dan gerak “paru”, tetapi tubuh manusia tidak identik dengan model.</p><div class="field"><label>Prediksi: jika membran bawah model ditarik ke bawah, apa yang terjadi?</label><select onchange="document.getElementById('pred3').textContent=this.value==='up'?'Benar. Ruang botol membesar, tekanan di luar balon turun, lalu balon mengembang dan udara masuk melalui pipa.':this.value==='down'?'Coba lagi: tarikan ke bawah justru memperbesar ruang dalam botol. Amati simulasi di bawah.':'Pilih prediksi terlebih dahulu.'"><option value="">Pilih…</option><option value="up">Volume membesar; balon mengembang</option><option value="down">Volume mengecil; balon mengembang</option></select></div><div id="pred3" class="feedback review">Pilih prediksi terlebih dahulu.</div>${bellJarSimulation()}`}

{id:'spiro',title:'B. Membaca Spirogram',html:`<p>Gelombang kecil berulang menggambarkan napas biasa. Inspirasi/ekspirasi maksimal memperlihatkan rentang volume yang lebih besar. Label Inggris pada sumber diterjemahkan dalam UI.</p><div class="pillRow"><span class="pill">Tidal Volume = Volume Tidal</span><span class="pill">IRV = Cadangan Inspirasi</span><span class="pill">ERV = Cadangan Ekspirasi</span><span class="pill">Residual Volume = Volume Residu</span></div>`,visual:'external-lung'},

6:{title:'Lab 6 — Gangguan & Perlindungan Sistem Pernapasan',q:'Bagaimana gangguan terjadi dan apa tindakan yang masuk akal untuk menjaga kesehatan?',sections:[
{id:'gangguan',title:'A. Mengenali Gangguan',html:`<div class="grid grid2"><div><h4>Asma</h4><p>Saluran napas dapat mengalami peradangan dan penyempitan; asma bukan penyakit menular.</p><h4>Bronkitis</h4><p>Peradangan pada bronkus yang dapat menimbulkan batuk dan lendir.</p><h4>Pneumonia</h4><p>Infeksi/peradangan jaringan paru yang dapat mengganggu pertukaran gas.</p></div><div><h4>Tuberkulosis</h4><p>Infeksi bakteri yang dapat menyerang paru dan menular melalui udara dalam kondisi tertentu.</p><h4>Influenza/ISPA</h4><p>Infeksi saluran napas dapat menimbulkan beragam gejala.</p><h4>Emfisema/PPOK</h4><p>Kerusakan kronis yang mengganggu fungsi paru; asap rokok merupakan faktor risiko penting.</p></div></div>`},
{id:'risiko',title:'B. Faktor Risiko',html:`<div class="pillRow"><span class="pill">Asap rokok</span><span class="pill">Polusi udara</span><span class="pill">Debu/iritan</span><span class="pill">Infeksi</span><span class="pill">Ventilasi buruk</span></div><p>Visual Kementerian Kesehatan digunakan sebagai stimulus literasi kesehatan, bukan alat diagnosis.</p>`,visual:'external-kemenkes'},
{id:'jaga',title:'C. Menjaga Kesehatan',html:`<ul><li>Tidak merokok dan menghindari asap rokok.</li><li>Mengurangi paparan debu/polutan bila memungkinkan.</li><li>Menjaga ventilasi ruang, kebersihan tangan, dan etika batuk.</li><li>Aktivitas fisik sesuai kemampuan dan pola hidup sehat.</li><li>Mengikuti anjuran kesehatan/vaksinasi yang berlaku.</li><li>Meminta bantuan orang dewasa/tenaga kesehatan bila gangguan berat atau menetap.</li></ul><div class="grid grid2"><img src="${a('ill_kelas_berdebu.webp')}" alt="Kelas dengan paparan debu" style="width:100%;border-radius:16px"><img src="${a('ill_kelas_sehat_pernapasan.webp')}" alt="Kelas sehat dengan ventilasi baik" style="width:100%;border-radius:16px"></div>`}
],checkpoint:[

function visualFor(v){if(!v)return '';if(v==='external-bbgtk')return `<div class="externalFrame"><img src="${a('ill_sistem_pernapasan_anatomi.webp')}" alt="Infografik anatomi sistem pernapasan manusia dengan label bronkus, bronkiolus, alveolus, dan diafragma"><div class="source">Visual internal RespiraLab — digambar ulang agar label bronkus, bronkiolus, alveolus, dan susunan anatomi lebih jelas.</div></div>`;if(v==='external-diaphragm')return externalImg(EXTERNAL.diaphragm,'Animasi gerakan diafragma saat inspirasi dan ekspirasi','Wikimedia Commons (CC0)',fallbackDiaphragmLocal());if(v==='external-kemenkes')return externalImg(EXTERNAL.kemenkes,'Poster edukasi dampak merokok pada paru-paru','Kementerian Kesehatan RI',fallbackKemenkesLocal());if(v==='external-lung')return externalImg(EXTERNAL.lungVolumes,'Grafik volume paru terhadap waktu','Wikimedia Commons (CC BY-SA 4.0)',fallbackSpiroLocal());return `<img src="${a(v)}" alt="Visual materi ${v}">`}
function labPage(i){const lab=LABS[i];const l=state.labs['lab'+i];const sections=lab.sections.map(s=>`<section id="${s.id}" class="card sectionCard"><div class="sectionMedia ${s.visual?'':'solo'}"><div><span class="eyebrow">${s.title}</span><div>${s.html}</div>${l.reviewRequired.some(id=>lab.checkpoint.find(q=>q.id===id)?.review===s.id)?`<button class="btn orange" onclick="markReviewed(${i},'${s.id}')">Saya sudah membaca ulang bagian ini</button>`:''}</div>${s.visual?`<div>${visualFor(s.visual)}</div>`:''}</div></section>`).join('');return wrap(`<span class="eyebrow">${labMeta[i-1][2]} • Akses Bebas</span><h2>${lab.title}</h2><p class="muted"><b>Pertanyaan Lab:</b> ${lab.q}</p><button class="btn deepDiveBtn" onclick="openDeepDive(${i})"><img src="${a('ikon_pendalaman.svg')}" alt=""> Pendalaman Materi Lab ${i}</button>${sections}<div class="card" id="checkpoint"><div class="checkpointHero"><div><span class="eyebrow">Cek Pemahaman</span><h3>Checkpoint Lab ${i}</h3><p>Jawaban salah tidak mengurangi Nilai Evaluasi. Baca ulang bagian terkait sebelum retry.</p></div><img src="${a(l.checkpointPassed?'char_oxybot_sukses.webp':'char_oxybot_ulangi.webp')}" alt="Oxy-bot"></div>${renderCheckpoint(i)}</div>${footerNav(i===1?'hub':'lab'+(i-1),i===6?'game':'lab'+(i+1))}`)}
function markReviewed(i,section){const l=state.labs['lab'+i];if(!l.reviewVisited.includes(section))l.reviewVisited.push(section);saveState(true);go('lab'+i);setTimeout(()=>document.getElementById('checkpoint')?.scrollIntoView({behavior:'smooth'}),100)}
function markSectionViewed(i,id){const l=state.labs['lab'+i];if(!l.viewedSections.includes(id))l.viewedSections.push(id);saveState()}
function renderCheckpoint(i){const lab=LABS[i],l=state.labs['lab'+i];return lab.checkpoint.map((q,idx)=>{const needs=l.reviewRequired.includes(q.id),reviewed=l.reviewVisited.includes(q.review),attempt=l.checkpointAttempts[q.id];const disabled=needs&&!reviewed;return `<div class="question"><div class="qtitle">${idx+1}. ${q.prompt}</div>${checkpointInput(i,q,disabled)}${attempt?`<div class="feedback ${attempt.correct?'ok':'review'}">${attempt.correct?q.ok:q.bad}${!attempt.correct?`<br><span class="reviewTag">Baca ulang: ${lab.sections.find(s=>s.id===q.review).title}</span>`:''}</div>`:''}${needs&&!reviewed?`<button class="btn orange" onclick="markSectionViewed(${i},'${q.review}');document.getElementById('${q.review}').scrollIntoView({behavior:'smooth'})">Baca Ulang Bagian Terkait</button>`:''}</div>`}).join('')+`<button class="btn" onclick="finishCheckpoint(${i})">Perbarui Status Lab</button>`}
function checkpointInput(i,q,disabled){const prefix=`cp_${i}_${q.id}`;if(q.type==='single')return q.options.map((o,k)=>`<label class="option"><input type="radio" name="${prefix}" value="${k}" ${disabled?'disabled':''}> ${o}</label>`).join('')+`<button class="btn secondary" ${disabled?'disabled':''} onclick="checkCheckpoint(${i},'${q.id}')">Periksa</button>`;if(q.type==='multi')return q.options.map((o,k)=>`<label class="option"><input type="checkbox" name="${prefix}" value="${k}" ${disabled?'disabled':''}> ${o}</label>`).join('')+`<button class="btn secondary" ${disabled?'disabled':''} onclick="checkCheckpoint(${i},'${q.id}')">Periksa</button>`;if(q.type==='text')return `<div class="field"><input id="${prefix}" ${disabled?'disabled':''} placeholder="Jawaban singkat"></div><button class="btn secondary" ${disabled?'disabled':''} onclick="checkCheckpoint(${i},'${q.id}')">Periksa</button>`;if(q.type==='order'){const arr=(state.labs['lab'+i].checkpointAttempts[q.id]?.order)||q.items.slice();return `<div class="orderList" id="${prefix}">${arr.map((x,k)=>`<div class="orderItem" data-value="${esc(x)}"><span>${k+1}. ${x}</span><span style="margin-left:auto"><button ${disabled?'disabled':''} onclick="moveCP('${prefix}',${k},-1)">↑</button> <button ${disabled?'disabled':''} onclick="moveCP('${prefix}',${k},1)">↓</button></span></div>`).join('')}</div><button class="btn secondary" ${disabled?'disabled':''} onclick="checkCheckpoint(${i},'${q.id}')">Periksa</button>`}if(q.type==='match'){const vals=Object.values(q.pairs);return `<div>${Object.keys(q.pairs).map((k,idx)=>`<div class="matchRow"><b>${k}</b><select id="${prefix}_${idx}" ${disabled?'disabled':''}><option value="">Pilih…</option>${vals.map(v=>`<option>${v}</option>`).join('')}</select></div>`).join('')}</div><button class="btn secondary" ${disabled?'disabled':''} onclick="checkCheckpoint(${i},'${q.id}')">Periksa</button>`}return ''}
function moveCP(id,index,dir){const el=document.getElementById(id);const items=[...el.children];const ni=index+dir;if(ni<0||ni>=items.length)return;dir<0?el.insertBefore(items[index],items[ni]):el.insertBefore(items[ni],items[index]);[...el.children].forEach((x,k)=>x.querySelector('span').firstChild.textContent=(k+1)+'. ')}
function checkCheckpoint(i,qid){const q=LABS[i].checkpoint.find(x=>x.id===qid),l=state.labs['lab'+i],p=`cp_${i}_${q.id}`;let correct=false,order=null;if(q.type==='single'){const x=document.querySelector(`input[name="${p}"]:checked`);correct=!!x&&Number(x.value)===q.answer}if(q.type==='multi'){const sel=[...document.querySelectorAll(`input[name="${p}"]:checked`)].map(x=>Number(x.value)).sort();correct=JSON.stringify(sel)===JSON.stringify(q.answer.slice().sort())}if(q.type==='text'){const v=document.getElementById(p).value.trim().toLowerCase().replace(/\s+/g,' ');correct=q.answer.map(x=>x.toLowerCase()).includes(v)}if(q.type==='order'){order=[...document.querySelectorAll(`#${p} .orderItem`)].map(x=>x.dataset.value);correct=JSON.stringify(order)===JSON.stringify(q.answer)}if(q.type==='match'){const keys=Object.keys(q.pairs);correct=keys.every((k,idx)=>document.getElementById(`${p}_${idx}`).value===q.pairs[k])}l.checkpointAttempts[q.id]={correct,order};if(correct){l.reviewRequired=l.reviewRequired.filter(x=>x!==q.id)}else{if(!l.reviewRequired.includes(q.id))l.reviewRequired.push(q.id);l.reviewVisited=l.reviewVisited.filter(x=>x!==q.review)}saveState();go('lab'+i);setTimeout(()=>document.getElementById('checkpoint')?.scrollIntoView(),50)}
function finishCheckpoint(i){const l=state.labs['lab'+i];l.checkpointPassed=LABS[i].checkpoint.every(q=>l.checkpointAttempts[q.id]?.correct===true);l.status=l.checkpointPassed?'done':(l.reviewRequired.length?'review':'studying');saveState(true);toast(l.checkpointPassed?'Lab selesai! Checkpoint berhasil.':'Checkpoint belum seluruhnya benar. Kamu tetap bebas membuka menu lain.');go('lab'+i)}

 d=\"M448 276 V264 H472\" fill=\"none\" stroke=\"#80536b\" stroke-width=\"8\"/><g fill=\"#d9bccd\"><circle cx=\"491\" cy=\"254\" r=\"8\"/><circle cx=\"519\" cy=\"247\" r=\"10\"/><circle cx=\"543\" cy=\"267\" r=\"7\"/></g></g><!-- overlays --></svg>"};
let missionRun=null,missionClock=null,missionClockLast=0;
function missionProgress(){if(!state.game.missions)state.game.missions={completed:{},timerEnabled:false};if(!state.game.missions.completed)state.game.missions.completed={};return state.game.missions}
function missionById(id){return MISSION_DATA.find(m=>m.id===id)}
function trackDone(track){const done=missionProgress().completed;return MISSION_DATA.filter(m=>m.track===track).filter(m=>done[m.id]?.completed).length}
function shuffled(values){const result=values.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function game(){const p=missionProgress(),total=MISSION_DATA.filter(m=>p.completed[m.id]?.completed).length;return wrap(`<div class="mgHubHero card"><div><span class="eyebrow">Mini game • Misi peneliti muda</span><h2>Misi RespiraLab</h2><p>Vero dan Reska membutuhkan bantuanmu. Selesaikan <b>9 misi</b> dengan mengamati, mencoba, dan menjelaskan bukti.</p><div class="pillRow"><span class="pill">${total}/9 misi selesai</span><span class="pill">± 2–3 menit per misi</span><span class="pill">Bebas mencoba kembali</span></div><label class="mgTimerChoice"><input type="checkbox" ${p.timerEnabled?'checked':''} onchange="setMissionTimer(this.checked)"> Tampilkan timer latihan</label><p class="small muted">Timer menghitung waktu aktif. Melewati 3 menit tetap boleh melanjutkan; lencana diperoleh dari pemahaman.</p></div><div class="mgHubCast"><img src="${a('char_vero_challenge.webp')}" alt="Vero membawa misi"><img src="${a('char_reska_olahraga.webp')}" alt="Reska bercelana olahraga membawa catatan misi"></div></div><div class="mgTracks">${Object.entries(MISSION_TRACKS).map(([key,t])=>{const n=trackDone(key),earned=n===3;return `<section class="mgTrack card"><div class="mgTrackTop"><span class="mgTrackIcon">${t.icon}</span><div><h3>${t.title}</h3><span class="small muted">${n}/3 misi selesai</span></div><img class="mgBadge ${earned?'earned':'pending'}" src="${a(t.asset)}" alt="${earned?'Lencana diperoleh':'Lencana belum diperoleh'}: ${t.badge}"></div><p>${t.summary}</p><div class="mgMissionList">${MISSION_DATA.filter(m=>m.track===key).map((m,i)=>`<button class="mgMissionCard" onclick="beginMission('${m.id}')"><span class="mgMissionNumber">${p.completed[m.id]?.completed?'✓':i+1}</span><span><b>${m.title}</b><small>${p.completed[m.id]?.completed?'Selesai • Main lagi':'Misi tersedia • ± 2–3 menit'}</small></span><span aria-hidden="true">→</span></button>`).join('')}</div><div class="mgBadgeGoal">${earned?'🏅 Lencana diperoleh:':'Selesaikan 3 misi untuk lencana:'} <b>${t.badge}</b></div></section>`}).join('')}</div><div class="mgLegacy card"><div><h3>Latihan Data Challenge</h3><p class="small muted">Latihan data pernapasan yang sebelumnya tetap tersedia.</p></div><button class="btn secondary" onclick="go('dataChallenge')">Buka latihan data</button></div><p class="small muted">Progres misi dan lencana tersimpan di perangkat. Latihan ini tidak mengubah Nilai Evaluasi Akhir.</p>${footerNav('lab6','evaluation')}`)}
function freshMissionBoard(m){return {selected:null,slots:Array(4).fill(null),gas:{o2:null,co2:null},design:{wall:null,area:null,distance:null},order:m.type==='repair'?['hidung','faring','trakea','laring','bronkus','alveolus','bronkiolus']:[],swap:null,resolved:[],spot:null,options:Object.fromEntries((m.spots||[]).map(s=>[s.id,shuffled([0,1,2])])),bank:shuffled(m.type==='labels'?Object.keys(m.labels):m.type==='functions'?['hidung','trakea','bronkiolus','alveolus','diafragma']:AIRWAY_ORDER)}}
function beginMission(id){const m=missionById(id);if(!m)return;syncMusic(true);playUiSound('start');stopMissionClock();missionRun={id,status:'brief',scene:0,attempts:0,elapsed:0,hint:false,won:false,feedback:null,invalid:[],badgeNew:false,...freshMissionBoard(m)};go('mission')}
function missionPage(){if(!missionRun)return game();const m=missionById(missionRun.id);const content=missionRun.status==='brief'?missionCinema(m):missionRun.status==='result'?missionResult(m):missionPlayShell(m);return wrap(content,false).replace('class="screen"','class="screen missionScreen"')}
function missionTop(m){return `<div class="mgTop"><button class="btn secondary" onclick="go('game')">← Semua misi</button><span class="eyebrow">${MISSION_TRACKS[m.track].title}</span><span class="small muted">Misi ${MISSION_DATA.filter(x=>x.track===m.track).findIndex(x=>x.id===m.id)+1}/3</span></div>`}
function missionCinema(m){const n=missionRun.scene,names=['VERO','RESKA','OXY-BOT'],roles=['Pemberi misi','Pemberi misi','Pemandu & petunjuk'],imgs=['char_vero_challenge.webp','char_reska_olahraga.webp','char_oxybot_menjelaskan.webp'];return `${missionTop(m)}<section class="mgCinema"><div class="mgCinemaStage"><img class="mgSceneChar ${n===0?'active':'dim'}" src="${a('char_vero_challenge.webp')}" alt="Vero"><div class="mgCinemaCase"><span class="mgSceneCounter">DIALOG ${n+1} / 3</span><h2>${m.title}</h2><p>${m.goal}</p><div class="mgCaseEmblem">${MISSION_TRACKS[m.track].icon}</div><span class="pill">Perkiraan misi: 2–3 menit</span></div><img class="mgSceneChar ${n===1?'active':'dim'}" src="${a('char_reska_olahraga.webp')}" alt="Reska mengenakan celana olahraga"></div><div class="mgDialogue"><img src="${a(imgs[n])}" alt="${names[n]} sedang berbicara"><div class="mgDialogueBody"><div><b>${names[n]}</b><span>${roles[n]}</span></div><p>${m.brief[n]}</p></div></div><div class="mgCinemaNav"><button class="btn secondary" onclick="missionScene(-1)" ${n===0?'disabled':''}>← Kembali</button><span class="small muted">Baca dialog, lalu lanjutkan.</span>${n<2?`<button class="btn" onclick="missionScene(1)">Lanjut dialog →</button>`:`<button class="btn orange" onclick="startMissionPlay()">Mulai misi →</button>`}</div></section>`}
function missionScene(delta){if(!missionRun||missionRun.status!=='brief')return;missionRun.scene=Math.max(0,Math.min(2,missionRun.scene+delta));playUiSound('select');go('mission')}
function startMissionPlay(){if(!missionRun)return;missionRun.status='play';go('mission')}
function missionPlayShell(m){const p=missionProgress();return `${missionTop(m)}<div class="mgPlayTitle"><div><h2>${m.title}</h2><p>${m.goal}</p></div><div class="mgTiming"><label><input type="checkbox" ${p.timerEnabled?'checked':''} onchange="setMissionTimer(this.checked)"> Timer opsional</label><span id="missionTime" class="${p.timerEnabled?'':'hidden'}"></span></div></div><div id="missionInteractive"></div>`}
function initMissionView(){if(state.navigation.lastRoute!=='mission'||!missionRun)return;if(missionRun.status==='play'){paintMission();if(!missionRun.won)startMissionClock()}}
function setMissionTimer(enabled){missionProgress().timerEnabled=!!enabled;saveState();updateMissionClockDisplay()}
function stopMissionClock(){if(missionClock!==null)clearInterval(missionClock);missionClock=null;missionClockLast=0}
function missionClockTick(now=Date.now()){if(!missionRun||missionRun.status!=='play'||missionRun.won||state.navigation.lastRoute!=='mission')return;const paused=document.hidden||!!document.querySelector('#modalRoot .modal')||!!document.querySelector('#imageZoomRoot img');if(missionClockLast&&!paused)missionRun.elapsed+=Math.max(0,now-missionClockLast);missionClockLast=now;updateMissionClockDisplay()}
function startMissionClock(){stopMissionClock();missionClockLast=Date.now();missionClock=setInterval(()=>missionClockTick(),1000);updateMissionClockDisplay()}
function updateMissionClockDisplay(){const el=document.getElementById('missionTime');if(!el||!missionRun)return;const enabled=missionProgress().timerEnabled;el.classList.toggle('hidden',!enabled);const sec=Math.floor(missionRun.elapsed/1000);el.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')} / acuan 03:00${sec>=180?' • boleh lanjut':''}`}
document.addEventListener('visibilitychange',()=>{if(missionRun)missionClockLast=Date.now()});
document.addEventListener('keydown',e=>{if(state.navigation.lastRoute!=='mission'||missionRun?.status!=='brief'||document.querySelector('#modalRoot .modal'))return;if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target?.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();missionScene(-1)}if(e.key==='ArrowRight'||e.key==='Enter'||e.code==='Space'){e.preventDefault();missionRun.scene<2?missionScene(1):startMissionPlay()}});
function paintMission(focusSelector){const host=document.getElementById('missionInteractive');if(!host||!missionRun)return;const m=missionById(missionRun.id),r=missionRun;host.innerHTML=`<div class="mgPlayGrid"><section class="mgBoard card" aria-label="Papan interaksi misi">${missionBoard(m)}<p class="mgModelNote">${m.track==='classroom'?'Ilustrasi kasus. Perubahan gambar merangkum tindakan bersama guru/petugas; bukan pengukuran kualitas udara.':m.track==='alveolus'?'Diagram skematis; warna, ukuran, dan jumlah partikel bukan skala sebenarnya.':'Peta urutan saluran udara; posisi kartu bukan bentuk anatomi sebenarnya.'}</p></section><aside class="mgCoach card"><div class="mgCoachHeader"><img src="${a(r.won?'char_oxybot_sukses.webp':'char_oxybot_menjelaskan.webp')}" alt="Oxy-bot"><div><b>OXY-BOT</b><span>Pemandu misi</span></div></div><p>${r.won?'Misi terpecahkan! Amati perubahan visual dan jelaskan alasannya.':'Coba keputusanmu. Jika belum tepat, kita periksa buktinya bersama.'}</p><button class="btn secondary mgHintBtn" aria-expanded="${r.hint}" onclick="toggleMissionHint()">${r.hint?'Tutup':'💡 Buka'} petunjuk</button>${r.hint?`<div class="mgHint">${m.hint}</div>`:''}<div class="mgMissionFeedback ${r.feedback?.kind||'neutral'}" role="status">${r.feedback?esc(r.feedback.text):'Belum dicek. Lengkapi papan atau pilih satu titik kasus.'}</div>${m.type==='hotspot'?`<div class="mgResolvedCount">${r.resolved.length}/3 titik ditangani</div>`:''}${r.won?`<button class="btn orange mgCheck" onclick="showMissionResult()">Lihat hasil & lencana →</button>`:m.type!=='hotspot'?`<button class="btn mgCheck" onclick="checkMission()">✓ Cek keputusan</button>`:''}${!r.won?`<button class="btn ghost mgReset" onclick="resetMissionBoard()">Atur ulang papan</button>`:''}<p class="small muted">Petunjuk dan mencoba kembali tidak mengurangi peluang memperoleh lencana.</p></aside></div>`;if(m.type==='hotspot')decorateClassroom(m);updateMissionClockDisplay();if(focusSelector)host.querySelector(focusSelector)?.focus()}
function toggleMissionHint(){if(!missionRun)return;missionRun.hint=!missionRun.hint;paintMission('.mgHintBtn')}
function resetMissionBoard(){if(!missionRun||missionRun.won)return;Object.assign(missionRun,freshMissionBoard(missionById(missionRun.id)));missionRun.feedback=null;missionRun.invalid=[];paintMission()}
function clearMissionFeedback(){missionRun.feedback=null;missionRun.invalid=[]}
function selectMissionToken(value){if(missionRun.won)return;missionRun.selected=value;clearMissionFeedback();paintMission(`[data-token="${value}"]`);playUiSound('select')}
function assignMissionSlot(index){const r=missionRun;if(r.won)return;if(!r.selected){r.feedback={kind:'neutral',text:'Pilih satu kartu label/organ terlebih dahulu, kemudian pilih kotak tujuan.'};paintMission();return}r.slots=r.slots.map((v,i)=>i!==index&&v===r.selected?null:v);r.slots[index]=r.selected;r.selected=null;clearMissionFeedback();paintMission(`[data-slot="${index}"]`)}
function tokenBank(m){const labels=m.type==='labels'?m.labels:AIRWAY_LABELS;return `<div class="mgTokenBank" role="group" aria-label="Kartu yang dapat dipilih">${missionRun.bank.map(key=>`<button class="mgToken ${missionRun.selected===key?'selected':''}" data-token="${key}" aria-pressed="${missionRun.selected===key}" onclick="selectMissionToken('${key}')" ${missionRun.won?'disabled':''}>${labels[key]}</button>`).join('')}</div>`}
function missionBoard(m){const r=missionRun;if(m.type==='labels'){const positions=[[80,27],[82,56],[82,73],[27,89]];return `<h3>1. Pilih label → 2. Klik kotak pada diagram</h3>${tokenBank(m)}<div class="mgFigureScroll"><div class="mgAlveolusFigure">${missionAlveolusSvg(m)}${positions.map(([x,y],i)=>`<button data-slot="${i}" class="mgFigureSlot ${r.invalid.includes(i)?'wrong':''} ${r.won?'correct':''}" style="left:${x}%;top:${y}%" onclick="assignMissionSlot(${i})" aria-label="Kotak ${i+1}: ${r.slots[i]?m.labels[r.slots[i]]:'belum terisi'}" ${r.won?'disabled':''}>${i+1}. ${r.slots[i]?m.labels[r.slots[i]]:'Pasang label'}</button>`).join('')}</div></div>`}
if(m.type==='gas'){return `<h3>Rancang panah pertukaran gas</h3><div class="mgGasControls">${[['o2','O₂'],['co2','CO₂']].map(([key,label])=>`<fieldset class="${r.invalid.includes(key)?'mgWrongGroup':''}"><legend>${label}</legend>${[['down','Alveolus → darah'],['up','Darah → alveolus']].map(([v,text])=>`<button class="mgToken ${r.gas[key]===v?'selected':''}" aria-pressed="${r.gas[key]===v}" onclick="chooseMissionGas('${key}','${v}')" ${r.won?'disabled':''}>${text}</button>`).join('')}</fieldset>`).join('')}</div><div class="mgFigureScroll">${missionAlveolusSvg(m)}</div><p class="small muted">${r.won?'Panah dan partikel menunjukkan difusi kedua gas secara bersamaan.':'Panah pilihanmu belum dinyatakan benar. Tekan Cek keputusan untuk mengujinya.'}</p>`}
if(m.type==='design'){return `<h3>Ubah tiga pengatur rancangan</h3><div class="mgDesignControls">${[['wall','Dinding membran',[['thin','Tipis'],['thick','Tebal']]],['area','Luas permukaan',[['wide','Luas'],['small','Sempit']]],['distance','Posisi kapiler',[['near','Dekat'],['far','Jauh']]]].map(([key,label,opts])=>`<fieldset class="${r.invalid.includes(key)?'mgWrongGroup':''}"><legend>${label}</legend>${opts.map(([v,t])=>`<button class="mgToken ${r.design[key]===v?'selected':''}" aria-pressed="${r.design[key]===v}" onclick="chooseMissionDesign('${key}','${v}')" ${r.won?'disabled':''}>${t}</button>`).join('')}</fieldset>`).join('')}</div><div class="mgFigureScroll">${missionAlveolusSvg(m)}</div><div class="mgDesignReadout"><span>Jarak difusi: ${r.design.wall&&r.design.distance?(r.design.wall==='thin'&&r.design.distance==='near'?'lebih pendek':'bertambah pada rancangan ini'):'pilih pengatur'}</span><span>Area pertukaran: ${r.design.area==='wide'?'lebih luas':r.design.area==='small'?'lebih sempit':'belum dipilih'}</span></div>`}

function chooseMissionGas(key,value){if(missionRun.won)return;missionRun.gas[key]=value;clearMissionFeedback();paintMission()}
function chooseMissionDesign(key,value){if(missionRun.won)return;missionRun.design[key]=value;clearMissionFeedback();paintMission()}
function appendAirway(key){const r=missionRun;if(r.won||r.order.includes(key)||r.order.length>=7)return;r.order.push(key);clearMissionFeedback();paintMission()}
function moveAirway(index,delta){const r=missionRun,j=index+delta;if(r.won||j<0||j>=r.order.length)return;[r.order[index],r.order[j]]=[r.order[j],r.order[index]];clearMissionFeedback();paintMission()}
function removeAirway(index){if(missionRun.won)return;missionRun.order.splice(index,1);clearMissionFeedback();paintMission()}
function swapAirway(index){const r=missionRun;if(r.won)return;if(r.swap===null){r.swap=index}else if(r.swap===index){r.swap=null}else{[r.order[r.swap],r.order[index]]=[r.order[index],r.order[r.swap]];r.swap=null}clearMissionFeedback();paintMission()}
function missionAlveolusSvg(m){const r=missionRun,design=m.type==='design',thick=design&&r.design.wall==='thick',far=design&&r.design.distance==='far',small=design&&r.design.area==='small',band=thick?25:9,offset=far?43:0,capTop=244+band+offset,cy=capTop+41;let overlay='';if(m.type==='labels')overlay='<path d="M430 120 H570 M526 243 H565 M556 305 H571 M219 307 V367" fill="none" stroke="#7f8e9e" stroke-width="2"/>';else{overlay=`<text x="302" y="126" text-anchor="middle" font-size="23" font-weight="700">Ruang alveolus</text><text x="312" y="${capTop+101}" text-anchor="middle" font-size="19">Kapiler darah</text><text x="606" y="230" font-size="16">Membran</text><text x="606" y="251" font-size="16">respirasi</text><path d="M537 242 H591" stroke="#7f8e9e" stroke-width="2"/>`}

function classroomBoard(m){const r=missionRun,s=m.spots.find(s=>s.id===r.spot);return `<h3>Klik titik dan selidiki sumber paparan</h3><p class="small">Klik titik bernomor, lalu pilih tindakan yang sesuai.</p><div class="mgFigureScroll"><div class="mgClassroomFigure">${MISSION_ART[m.scene]}${m.spots.map((spot,i)=>`<button class="mgHotspot ${r.resolved.includes(spot.id)?'resolved':''} ${r.spot===spot.id?'selected':''}" style="left:${spot.x}%;top:${spot.y}%" onclick="selectClassroomSpot('${spot.id}')" aria-label="Titik ${i+1}: ${spot.name}${r.resolved.includes(spot.id)?', sudah ditangani':''}">${r.resolved.includes(spot.id)?'✓':i+1}</button>`).join('')}</div></div><div class="mgSpotLegend">${m.spots.map((spot,i)=>`<button onclick="selectClassroomSpot('${spot.id}')">${r.resolved.includes(spot.id)?'✓':i+1+'.'} ${spot.name}</button>`).join('')}</div>${s?`<section class="mgActionPanel"><h4>${s.name}</h4>${r.feedback?`<p class="mgInlineFeedback ${r.feedback.kind}" aria-hidden="true">${esc(r.feedback.text)}</p>`:''}${r.resolved.includes(s.id)?`<p class="mgResolvedCount">✓ Titik ini sudah ditangani.</p>${r.won?`<button class="btn orange" onclick="showMissionResult()">Lihat hasil misi →</button>`:m.spots.find(x=>!r.resolved.includes(x.id))?`<button class="btn secondary" onclick="selectClassroomSpot('${m.spots.find(x=>!r.resolved.includes(x.id)).id}')">Selidiki titik berikutnya →</button>`:''}`:`<p>Pilih tindakan yang sesuai kasus.</p><div class="mgActionChoices">${r.options[s.id].map(i=>`<button class="mgActionChoice" onclick="answerClassroomSpot('${s.id}',${i})" ${r.won?'disabled':''}>${s.choices[i]}</button>`).join('')}</div>`}</section>`:'<div class="mgActionPanel"><p>Mulai dari salah satu titik bernomor. Kamu juga dapat memilih nama titik pada daftar.</p></div>'}`}
function decorateClassroom(m){const root=document.querySelector('.mgClassroomFigure svg');if(!root)return;for(const id of missionRun.resolved){const group=root.querySelector('#hazard-'+id);if(!group)continue;if(id==='wall'){group.setAttribute('opacity','.65')}else if(id==='engine'){group.querySelector('path[opacity]')?.setAttribute('opacity','0')}else if(id==='board'){group.querySelectorAll('circle').forEach(c=>c.setAttribute('opacity','0'))}else group.setAttribute('opacity','0')}
if(m.scene==='dust'&&missionRun.resolved.includes('window')){root.insertAdjacentHTML('beforeend','<path d="M662 100 H845 M832 88 L846 100 L832 112" fill="none" stroke="#268777" stroke-width="7"/>')}
const labels={floor:'Debu ditangani',board:'Penghapus dibersihkan',window:'Ventilasi dibuka',engine:'Mesin dimatikan',waiting:'Area tunggu dipindahkan',intake:'Sisi udara bersih dipilih',wall:'Dilaporkan ke guru',cabinet:'Ventilasi dibebaskan',spray:'Sumber bau ditangani'};const text=missionRun.resolved.map(id=>labels[id]);if(text.length)root.insertAdjacentHTML('beforeend',`<g font-family="sans-serif" font-size="16" fill="#146448">${text.map((t,i)=>`<rect x="25" y="${445-i*27}" width="300" height="23" rx="7" fill="#e6f7eb"/><text x="34" y="${462-i*27}">✓ ${t}</text>`).join('')}</g>`)}
function selectClassroomSpot(id){if(!missionRun)return;if(!missionRun.won&&missionRun.spot!==id)clearMissionFeedback();missionRun.spot=id;paintMission('.mgActionPanel button')}
function answerClassroomSpot(id,index){const r=missionRun,m=missionById(r.id),spot=m.spots?.find(s=>s.id===id);if(!spot||r.won||r.resolved.includes(id))return;r.attempts++;if(index!==0){r.feedback={kind:'review',text:spot.why[index]+' Coba pilihan lain; titik ini belum ditangani.'};playUiSound('review');paintMission();return}r.resolved.push(id);r.feedback={kind:'ok',text:spot.why[0]+' Perubahan pada gambar menandai tindakan yang dipilih.'};playUiSound('success');if(r.resolved.length===m.spots.length)completeMission(m);paintMission()}
function checkMission(){const r=missionRun;if(!r||r.won)return;const m=missionById(r.id);let invalid=[],incomplete=false,msg='';if(m.type==='labels'||m.type==='functions'){const answers=m.answers||m.targets.map(t=>t.answer);incomplete=r.slots.some(v=>!v);invalid=answers.flatMap((v,i)=>r.slots[i]!==v?[i]:[]);msg=m.type==='labels'?'Label di kotak '+(invalid[0]+1)+' belum sesuai letak bagian. Bedakan ruang udara dari darah dan sel di dalam kapiler.':'Pasangan fungsi '+(invalid[0]+1)+' belum tepat. Perhatikan kata kunci fungsi dan bedakan saluran dari otot.'}
if(m.type==='gas'){incomplete=!r.gas.o2||!r.gas.co2;invalid=['o2','co2'].filter(k=>r.gas[k]!==({o2:'down',co2:'up'})[k]);msg=invalid[0]==='o2'?'Panah O₂ belum mengikuti arah dari sumbernya di ruang alveolus ke darah. Balik arah panah itu.':'CO₂ dibawa darah dari jaringan dan perlu masuk ke alveolus untuk dikeluarkan. Periksa panah CO₂.'}
if(m.type==='design'){incomplete=Object.values(r.design).some(v=>!v);invalid=Object.keys(r.design).filter(k=>r.design[k]!==({wall:'thin',area:'wide',distance:'near'})[k]);msg=invalid[0]==='wall'?'Dinding lebih tebal menambah jarak difusi. Coba bandingkan dengan dinding tipis.':invalid[0]==='area'?'Area lebih sempit mengurangi luas tempat pertukaran. Bandingkan rancangan dengan area luas.':'Kapiler lebih jauh menambah lintasan gas. Bandingkan posisi yang dekat.'}
if(m.type==='order'||m.type==='repair'){incomplete=r.order.length!==7;invalid=AIRWAY_ORDER.flatMap((v,i)=>r.order[i]!==v?[i]:[]);msg='Pos '+(invalid[0]+1)+' belum tepat. Telusuri jalur dari rongga hidung; ingat cabang kecil menuju alveolus.'}
if(incomplete){r.feedback={kind:'neutral',text:'Papan belum lengkap. Isi semua kotak/pengatur sebelum mengecek.'};paintMission();return}r.attempts++;r.invalid=invalid;if(invalid.length){r.feedback={kind:'review',text:msg+' Bagian yang perlu diperbaiki ditandai.'};playUiSound('review')}else{completeMission(m);playUiSound('success')}paintMission()}
function completeMission(m){const r=missionRun;if(r.won)return;missionClockTick();stopMissionClock();const p=missionProgress(),wasBadge=trackDone(m.track)===3;r.won=true;r.invalid=[];r.feedback={kind:'ok',text:m.success};p.completed[m.id]={completed:true,attempts:r.attempts,elapsedSeconds:Math.round(r.elapsed/1000),completedAt:new Date().toISOString()};r.badgeNew=!wasBadge&&trackDone(m.track)===3;saveState()}

function missionResult(m){const t=MISSION_TRACKS[m.track],done=trackDone(m.track),earned=done===3,next=MISSION_DATA.find(x=>x.track===m.track&&!missionProgress().completed[x.id]?.completed);return `${missionTop(m)}<section class="mgResult card"><span class="eyebrow">✓ Misi selesai</span><h2>${m.title}</h2><div class="mgResultVisual">${earned?`<img class="mgResultBadge" src="${a(t.asset)}" alt="Lencana ${t.badge}">`:`<img class="mgResultOxy" src="${a('char_oxybot_sukses.webp')}" alt="Oxy-bot merayakan keberhasilan">`}</div><h3>${earned?(missionRun.badgeNew?'Lencana baru: ':'Lencana dimiliki: ')+t.badge:`${done}/3 misi ${t.title} selesai`}</h3><p>${m.success}</p><div class="mgResultEvidence"><b>Bukti pemahamanmu</b><p>${m.type==='hotspot'?'Kamu memilih tindakan sesuai sumber paparan pada ketiga titik kasus.':m.type==='labels'?'Keempat label ditempatkan sesuai struktur diagram.':m.type==='gas'?'Kedua arah difusi dipasang dengan benar.':m.type==='design'?'Ketiga karakteristik pertukaran gas dipilih dengan benar.':m.type==='functions'?'Keempat organ dipasangkan dengan fungsi yang benar.':'Ketujuh organ tersusun dalam urutan yang benar.'}</p></div><p class="small muted">${missionProgress().timerEnabled?'Waktu aktif: '+Math.floor(missionRun.elapsed/60000)+' menit '+Math.floor(missionRun.elapsed/1000)%60+' detik. ':''}Mencoba kembali dan menggunakan petunjuk tetap dihargai.</p><div class="mgResultActions">${next?`<button class="btn orange" onclick="beginMission('${next.id}')">Misi berikutnya →</button>`:''}<button class="btn secondary" onclick="beginMission('${m.id}')">Mainkan lagi</button><button class="btn" onclick="go('game')">Kembali ke semua misi</button></div></section>`}
