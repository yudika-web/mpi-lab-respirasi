let currentEvalIndex=0;
function evaluation(){return wrap(`<span class="eyebrow">Evaluasi Akhir • Kognitif</span><h2>Evaluasi E-20</h2><div class="callout"><b>20 soal:</b> LOTS 10 • MOTS 4 • HOTS 2 • AKM/PISA 4. Feedback benar/salah ditampilkan setelah Evaluasi dikirim. Jawaban disimpan sebagai draft lokal.</div><div id="evalNav" class="evalNav"></div><div id="evalQuestion"></div><div class="footerNav"><button class="btn secondary" onclick="evalPrev()">← Sebelumnya</button><button class="btn orange" onclick="confirmSubmitEval()">Kirim Evaluasi</button><button class="btn" onclick="evalNext()">Berikutnya →</button></div>`)}
function renderEvalNav(){const nav=document.getElementById('evalNav');if(!nav)return;nav.innerHTML=EVAL.map((q,i)=>`<button class="${hasDraft(q)?'answered':''} ${i===currentEvalIndex?'active':''}" onclick="saveCurrentEval();currentEvalIndex=${i};renderEvalQuestion(${i})">${i+1}</button>`).join('')}
function hasDraft(q){const d=state.evaluation.draft[q.id];return d!==undefined&&d!==null&&(Array.isArray(d)?d.length>0:typeof d==='object'?Object.keys(d).length>0:String(d).length>0)}
function evalVisual(q){if(q.visual==='lung')return `<div class="sectionMedia"><div>${externalImg(EXTERNAL.lungVolumes,'Grafik volume paru','Wikimedia Commons')}</div><div class="spiroFallback"><svg viewBox="0 0 700 260"><line x1="50" y1="220" x2="670" y2="220" stroke="#aaa"/><path d="M50 150 C80 125,100 175,130 150 S180 125,210 150 S260 178,290 150 C320 130,330 45,350 65 C370 90,390 195,420 180 C450 165,470 125,500 150 S550 175,580 150 S630 128,670 150" fill="none" stroke="#6D4CCF" stroke-width="5"/></svg><div class="small center">Fallback grafik sederhana</div></div></div>`;if(q.visual==='dust')return `<img src="${a('ill_kelas_berdebu.webp')}" alt="Konteks kelas berdebu" style="width:100%;max-height:310px;object-fit:contain;border-radius:16px">`;if(q.visual==='healthy')return `<img src="${a('ill_kelas_sehat_pernapasan.webp')}" alt="Kelas sehat" style="width:100%;max-height:310px;object-fit:contain;border-radius:16px">`;return ''}
function renderEvalQuestion(i){currentEvalIndex=i;const q=EVAL[i],d=state.evaluation.draft[q.id];const el=document.getElementById('evalQuestion');if(!el)return;el.innerHTML=`<div class="question"><div class="pillRow"><span class="tag">${q.id}</span><span class="tag">${q.type.toUpperCase()}</span><span class="tag">${q.level}</span><span class="tag">${q.topic}</span></div><h3>${i+1}. ${q.q}</h3>${evalVisual(q)}${evalInput(q,d)}</div>`;renderEvalNav()}
function evalInput(q,d){if(q.type==='single')return q.opts.map((o,k)=>`<label class="option"><input type="radio" name="eval_${q.id}" value="${k}" ${Number(d)===k?'checked':''}> ${o}</label>`).join('');if(q.type==='multi')return q.opts.map((o,k)=>`<label class="option"><input type="checkbox" name="eval_${q.id}" value="${k}" ${Array.isArray(d)&&d.includes(k)?'checked':''}> ${o}</label>`).join('');if(q.type==='text')return `<div class="field"><input id="eval_${q.id}" value="${esc(d||'')}" placeholder="Jawaban singkat"></div>`;if(q.type==='tf')return `<div class="tfGrid">${q.items.map((x,k)=>`<div class="tfRow"><span>${x[0]}</span><label><input type="radio" name="eval_${q.id}_${k}" value="true" ${d&&d[k]===true?'checked':''}> Benar</label><label><input type="radio" name="eval_${q.id}_${k}" value="false" ${d&&d[k]===false?'checked':''}> Salah</label></div>`).join('')}</div>`;if(q.type==='match'){const vals=Object.values(q.pairs);return Object.keys(q.pairs).map((k,idx)=>`<div class="matchRow"><b>${k}</b><select id="eval_${q.id}_${idx}"><option value="">Pilih…</option>${vals.map(v=>`<option ${d&&d[k]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}if(q.type==='order'){const arr=Array.isArray(d)&&d.length?d:q.items.slice();return `<div class="orderList" id="eval_${q.id}">${arr.map((x,k)=>`<div class="orderItem" data-value="${esc(x)}"><span>${k+1}. ${x}</span><span style="margin-left:auto"><button onclick="moveEval('${q.id}',${k},-1)">↑</button> <button onclick="moveEval('${q.id}',${k},1)">↓</button></span></div>`).join('')}</div>`}return ''}
function saveCurrentEval(){const q=EVAL[currentEvalIndex],id=q.id,p=`eval_${id}`;if(q.type==='single'){const x=document.querySelector(`input[name="${p}"]:checked`);if(x)state.evaluation.draft[id]=Number(x.value)}else if(q.type==='multi'){state.evaluation.draft[id]=[...document.querySelectorAll(`input[name="${p}"]:checked`)].map(x=>Number(x.value))}else if(q.type==='text'){state.evaluation.draft[id]=document.getElementById(p)?.value.trim()||''}else if(q.type==='tf'){const obj={};q.items.forEach((_,k)=>{const x=document.querySelector(`input[name="${p}_${k}"]:checked`);if(x)obj[k]=x.value==='true'});state.evaluation.draft[id]=obj}else if(q.type==='match'){const obj={};Object.keys(q.pairs).forEach((k,idx)=>obj[k]=document.getElementById(`${p}_${idx}`)?.value||'');state.evaluation.draft[id]=obj}else if(q.type==='order'){state.evaluation.draft[id]=[...document.querySelectorAll(`#${p} .orderItem`)].map(x=>x.dataset.value)}saveState()}
function moveEval(id,index,dir){saveCurrentEval();const q=EVAL.find(x=>x.id===id);let arr=state.evaluation.draft[id]||q.items.slice();const ni=index+dir;if(ni<0||ni>=arr.length)return;[arr[index],arr[ni]]=[arr[ni],arr[index]];state.evaluation.draft[id]=arr;saveState();renderEvalQuestion(currentEvalIndex)}
function evalNext(){saveCurrentEval();currentEvalIndex=Math.min(EVAL.length-1,currentEvalIndex+1);renderEvalQuestion(currentEvalIndex);window.scrollTo(0,0)}function evalPrev(){saveCurrentEval();currentEvalIndex=Math.max(0,currentEvalIndex-1);renderEvalQuestion(currentEvalIndex);window.scrollTo(0,0)}
function confirmSubmitEval(){saveCurrentEval();const answered=EVAL.filter(hasDraft).length;modal(`<h2>Kirim Evaluasi?</h2><p>Kamu telah mengisi <b>${answered}/20</b> soal. Setelah dikirim, feedback dan Bagian Perlu Penguatan akan dihitung.</p>${answered<20?'<div class="callout">Masih ada soal yang belum terisi. Soal kosong mendapat skor 0.</div>':''}<div class="footerNav"><button class="btn secondary" onclick="closeModal()">Kembali</button><button class="btn orange" onclick="closeModal();submitEval()">Ya, Kirim</button></div>`)}
function scoreQuestion(q,d){const max=5;if(d===undefined||d===null)return 0;if(q.type==='single')return Number(d)===q.ans?5:0;if(q.type==='text'){const v=String(d).trim().toLowerCase().replace(/\s+/g,' ');return q.ans.map(x=>x.toLowerCase()).includes(v)?5:0}if(q.type==='multi'){const sel=new Set(Array.isArray(d)?d:[]);let correct=0;q.opts.forEach((_,i)=>{const should=q.ans.includes(i);if(sel.has(i)===should)correct++});return 5*correct/q.opts.length}if(q.type==='tf'){let correct=0;q.items.forEach((x,k)=>{if(d[k]===x[1])correct++});return 5*correct/q.items.length}if(q.type==='match'){let correct=0;Object.keys(q.pairs).forEach(k=>{if(d[k]===q.pairs[k])correct++});return 5*correct/Object.keys(q.pairs).length}if(q.type==='order'){let correct=0;q.ans.forEach((x,k)=>{if(d[k]===x)correct++});return 5*correct/q.ans.length}return 0}
function submitEval(){let total=0;const detail=[];const topic={};EVAL.forEach(q=>{const earned=scoreQuestion(q,state.evaluation.draft[q.id]);total+=earned;detail.push({id:q.id,earned,max:5,topic:q.topic,indicator:q.indicator,tp:q.tp});topic[q.topic]??={earned:0,max:0};topic[q.topic].earned+=earned;topic[q.topic].max+=5});const score=Math.round(total);const category=score>=86?'Pemahaman Sangat Kuat':score>=71?'Pemahaman Kuat':score>=56?'Pemahaman Berkembang':'Perlu Penguatan';const miss={};detail.filter(x=>x.earned<5).forEach(x=>{const key=x.topic+' — '+x.indicator;miss[key]=(miss[key]||0)+(x.max-x.earned)});const strengthening=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([key,missing])=>({key,missing}));state.evaluation.submitted=true;state.evaluation.latestAttempt={score,category,detail,submittedAt:new Date().toISOString()};state.result={score,category,topicScores:topic,strengtheningAreas:strengthening};saveState(true);playUiSound('success');go('result')}
function result(){if(!state.evaluation.submitted)return dashboard();const r=state.result;return wrap(`<span class="eyebrow">Lihat Hasil</span><h2>Hasil Evaluasi ${esc(state.student.name)}</h2><div class="grid grid2"><div class="card center"><div class="resultScore" style="--scoredeg:${r.score*3.6}deg"><div class="inside"><strong>${r.score}</strong><div>/100</div></div></div><h3>${r.category}</h3><p class="muted">Kategori ini adalah aturan tampilan MPI, bukan ambang ketuntasan nasional.</p></div><div class="card"><h3>Penguasaan per topik</h3>${Object.entries(r.topicScores).map(([k,v])=>{const p=Math.round(v.earned/v.max*100);return `<div class="topicRow"><b>${k}</b><div class="bar"><span style="width:${p}%"></span></div><span>${p}%</span></div>`}).join('')}</div></div><h3>Bagian Perlu Penguatan</h3><div class="grid grid3">${r.strengtheningAreas.length?r.strengtheningAreas.map(x=>{const topic=x.key.split(' — ')[0];const lab=({'Organ & Jalur Udara':1,'Alveolus & Pertukaran Gas':2,'Mekanisme Pernapasan':3,'Volume & Frekuensi':4,'Faktor Pernapasan':5,'Gangguan & Kesehatan':6})[topic]||1;return `<div class="card reinforce"><b>${x.key}</b><p class="muted">Kehilangan skor relatif: ${x.missing.toFixed(1)} poin. Ulangi Lab terkait untuk memperkuat indikator ini.</p><button class="btn secondary" onclick="go('lab${lab}')">Ulangi Lab ${lab}</button></div>`}).join(''):`<div class="card">Semua butir mendapat skor maksimum. Pertahankan pemahaman dengan menjelaskan kembali konsep menggunakan bahasamu sendiri.</div>`}</div><h3>Review 20 soal</h3><div class="grid grid2">${EVAL.map(q=>{const d=state.evaluation.latestAttempt.detail.find(x=>x.id===q.id);return `<div class="card"><div class="pillRow"><span class="tag">${q.id}</span><span class="tag">${q.level}</span><span class="tag">${d.earned.toFixed(1)}/5</span></div><b>${q.indicator}</b><p class="small">${q.fb}</p></div>`}).join('')}</div><div class="footerNav"><button class="btn secondary" onclick="retakeEval()">Coba Evaluasi Lagi</button><button class="btn" onclick="go('reflection')">Lanjut Refleksi</button></div>`)}
function retakeEval(){modal(`<h2>Mulai evaluasi ulang?</h2><p>Draft jawaban akan dikosongkan. Nilai terbaru akan menggantikan tampilan hasil sesi.</p><div class="footerNav"><button class="btn secondary" onclick="closeModal()">Batal</button><button class="btn orange" onclick="state.evaluation.draft={};state.evaluation.submitted=false;state.result={score:null,category:null,topicScores:{},strengtheningAreas:[]};saveState();closeModal();currentEvalIndex=0;go('evaluation')">Mulai Ulang</button></div>`)}
function reflection(){return wrap(`<span class="eyebrow">Catatan Ilmuwan RespiraLab</span><h2>Refleksi Pembelajaran</h2><div class="reflectionMascots"><img src="${a('char_reska_refleksi.webp')}" alt="Reska melakukan refleksi"><img src="${a('char_vero_refleksi.webp')}" alt="Vero meninjau hasil belajar"></div><div class="card"><div class="field"><label>1. Sekarang saya paling memahami…</label><textarea id="r1" rows="3"></textarea></div><div class="field"><label>2. Bagian yang masih sulit atau membingungkan…</label><textarea id="r2" rows="3"></textarea></div><div class="field"><label>3. Bukti/data/aktivitas yang paling membantu saya adalah…</label><textarea id="r3" rows="3"></textarea></div><div class="field"><label>4. Agar lebih paham, saya akan…</label><textarea id="r4" rows="3"></textarea></div><label><b>5. Keyakinan pemahaman</b></label><div class="confidence">${[1,2,3,4].map(n=>`<label><input type="radio" name="conf" value="${n}"> ${n} — ${['masih perlu banyak bantuan','mulai memahami','cukup yakin','dapat menjelaskan kepada orang lain'][n-1]}</label>`).join('')}</div><div class="callout"><b>Dugaan awalmu:</b> ${esc(state.aperception.initialHypothesis||'(belum diisi)')}<br><br>Setelah belajar, apakah pemikiranmu berubah?<div class="pillRow">${['Tidak banyak berubah','Sedikit berubah','Banyak berubah'].map(x=>`<label class="pill"><input type="radio" name="changed" value="${x}"> ${x}</label>`).join('')}</div></div><button class="btn" onclick="saveReflection()">Simpan Refleksi</button></div>${footerNav(state.evaluation.submitted?'result':'dashboard','dashboard')}`)}
function fillReflection(){document.getElementById('r1').value=state.reflection.understood||'';document.getElementById('r2').value=state.reflection.difficult||'';document.getElementById('r3').value=state.reflection.helpfulEvidence||'';document.getElementById('r4').value=state.reflection.improvementPlan||'';if(state.reflection.confidence){const e=document.querySelector(`input[name="conf"][value="${state.reflection.confidence}"]`);if(e)e.checked=true}if(state.reflection.changed){const e=document.querySelector(`input[name="changed"][value="${CSS.escape(state.reflection.changed)}"]`);if(e)e.checked=true}}
function saveReflection(){state.reflection.understood=document.getElementById('r1').value.trim();state.reflection.difficult=document.getElementById('r2').value.trim();state.reflection.helpfulEvidence=document.getElementById('r3').value.trim();state.reflection.improvementPlan=document.getElementById('r4').value.trim();state.reflection.confidence=Number(document.querySelector('input[name="conf"]:checked')?.value)||null;state.reflection.changed=document.querySelector('input[name="changed"]:checked')?.value||'';saveState(true);toast('Refleksi tersimpan di perangkat ini.')}
function lockedResult(){toast('Selesaikan Evaluasi terlebih dahulu.');return dashboard()}
const routes={intro,identity,guide,aperception,dashboard,objectives,hub,lab1:()=>labPage(1),lab2:()=>labPage(2),lab3:()=>labPage(3),lab4:()=>labPage(4),lab5:()=>labPage(5),lab6:()=>labPage(6),game,dataChallenge,mission:missionPage,evaluation,result,reflection,lockedResult};
// tandai subbagian yang terlihat sebagai pernah dipelajari
let observer=null;if('IntersectionObserver' in window){observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){const route=state.navigation.lastRoute;if(/^lab[1-6]$/.test(route)){markSectionViewed(Number(route.slice(3)),e.target.id)}}})},{threshold:.55})}
const _go=go;go=function(route,arg){_go(route,arg);setTimeout(()=>{document.querySelectorAll('.sectionCard[id]').forEach(x=>{if(observer)observer.observe(x);else if(/^lab[1-6]$/.test(state.navigation.lastRoute))markSectionViewed(Number(state.navigation.lastRoute.slice(3)),x.id)})},20)};
// mulai sesuai progres onboarding
function showFatalError(err){try{const app=document.getElementById('app');if(app)app.innerHTML=`<main class="content"><div class="card"><h2>RespiraLab tidak dapat dimuat sepenuhnya</h2><p>Browser ini tidak mendukung salah satu fitur yang digunakan. Coba buka file dengan Chrome, Edge, atau Firefox versi terbaru.</p><div class="callout"><b>Pesan teknis:</b> ${esc(err&&err.message?err.message:String(err||'Unknown error'))}</div><button class="btn" onclick="location.reload()">Muat Ulang</button></div></main>`}catch(_){}}
window.addEventListener('error',e=>{if(!document.querySelector('.hero,.screen'))showFatalError(e.error||e.message)});window.addEventListener('unhandledrejection',e=>{if(!document.querySelector('.hero,.screen'))showFatalError(e.reason)});
(function init(){try{let r='intro';if(state.onboarding.introSeen)r='identity';if(state.student.name&&state.student.className)r='guide';if(state.onboarding.guideSeen)r='aperception';if(state.onboarding.aperceptionCompleted)r=state.navigation.lastRoute||'dashboard';if((r==='intro'||r==='identity')&&state.onboarding.aperceptionCompleted)r='dashboard';go(r)}catch(err){showFatalError(err)}})();
</script>
