<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
<title id="t">Oksigen berikatan dengan hemoglobin di dalam sel darah merah</title>
<desc id="d">Diagram sederhana menunjukkan oksigen berdifusi ke kapiler, masuk ke eritrosit, dan berikatan reversibel dengan hemoglobin membentuk oksihemoglobin.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FCFAFF"/><stop offset="1" stop-color="#F5EFFF"/></linearGradient><radialGradient id="rbc" cx="50%" cy="44%" r="62%"><stop offset="0" stop-color="#F79AA6"/><stop offset=".62" stop-color="#D84A62"/><stop offset="1" stop-color="#A72E48"/></radialGradient></defs>
<rect width="760" height="360" rx="28" fill="url(#bg)"/>
<text x="38" y="45" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#3F267F">Dari alveolus ke eritrosit</text>
<path d="M75 132C165 72 270 72 342 118" fill="none" stroke="#DCCFF7" stroke-width="30" stroke-linecap="round"/>
<text x="80" y="99" font-family="Arial,sans-serif" font-size="16" fill="#5D5470">membran respirasi</text>
<g fill="#6D4CCF" stroke="#fff" stroke-width="3"><circle cx="111" cy="151" r="17"/><circle cx="168" cy="142" r="17"/><circle cx="225" cy="132" r="17"/><circle cx="279" cy="126" r="17"/></g>
<g font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff"><text x="99" y="156">O₂</text><text x="156" y="147">O₂</text><text x="213" y="137">O₂</text><text x="267" y="131">O₂</text></g>
<path d="M305 126c36 7 56 24 78 49" fill="none" stroke="#6D4CCF" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#6D4CCF"/></marker></defs>
<ellipse cx="502" cy="183" rx="142" ry="79" fill="url(#rbc)"/>
<ellipse cx="502" cy="183" rx="83" ry="39" fill="#B72F4A" opacity=".7"/>
<text x="434" y="91" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9C2D45">Sel darah merah</text>
<g transform="translate(455 146)"><circle cx="0" cy="0" r="22" fill="#762A8A"/><circle cx="48" cy="0" r="22" fill="#8E3AA1"/><circle cx="0" cy="48" r="22" fill="#8E3AA1"/><circle cx="48" cy="48" r="22" fill="#762A8A"/><text x="7" y="31" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Hb</text><g fill="#FFD66B" stroke="#fff" stroke-width="2"><circle cx="-18" cy="-20" r="10"/><circle cx="66" cy="-20" r="10"/><circle cx="-18" cy="68" r="10"/><circle cx="66" cy="68" r="10"/></g><g font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#503700"><text x="-24" y="-17">O₂</text><text x="60" y="-17">O₂</text><text x="-24" y="71">O₂</text><text x="60" y="71">O₂</text></g></g>
<text x="406" y="294" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#3F267F">Hb + O₂ ⇌ HbO₂</text>
<text x="62" y="316" font-family="Arial,sans-serif" font-size="15" fill="#5D5470">O₂ berdifusi mengikuti gradien tekanan parsial, lalu sebagian besar diangkut terikat hemoglobin.</text>
</svg>
